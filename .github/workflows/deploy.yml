name: Daily lesson and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 23:00 UTC = 06:00 Vietnam time (UTC+7)
    - cron: '0 23 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate daily lesson across all 12 disciplines
        run: python scripts/generate_channel_daily.py
      - name: Test GE4u pages
        run: python scripts/test_ge4u_site.py
      - name: Persist generated daily lesson to main
        run: |
          if git diff --quiet -- data/daily-lesson.json; then
            echo "Daily lesson source is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/daily-lesson.json
            git commit -m "chore: refresh daily lesson for Asia/Ho_Chi_Minh"
            git push origin HEAD:main
          fi
      - name: Prepare site artifact
        run: |
          mkdir -p _site/data _site/admin
          cp *.html *.js _site/
          cp tiktok*.txt _site/ 2>/dev/null || true
          cp admin/*.html _site/admin/
          cp data/*.json _site/data/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
