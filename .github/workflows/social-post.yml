name: Social auto-post
# Free replacement for Metricool: posts the day's plan straight through the official APIs.
# Each platform is enabled only when its secrets exist (Settings → Secrets and variables → Actions).
on:
  schedule:
    # every 10 minutes, 07:00–22:59 Asia/Ho_Chi_Minh (00:00–15:59 UTC). GitHub often starts scheduled runs
    # 10–60 min late and skips some at busy times, so frequent off-peak minutes keep posts close to their time.
    - cron: '3,13,23,33,43,53 0-15 * * *'
    # 06:07 VN: fill the Hub's "today" table before the morning report
    - cron: '7 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Plan date (YYYY-MM-DD). Empty = today in Vietnam.'
        required: false
      dry_run:
        description: 'Only list what would be posted'
        type: boolean
        default: true
      only:
        description: 'Limit to platforms, e.g. threads or instagram,facebook,youtube,promo'
        required: false
      retry_failed:
        description: 'Retry posts that failed earlier today (after renewing a token)'
        type: boolean
        default: false
      late_limit_min:
        description: 'Post items up to this many minutes late (default 180)'
        required: false
permissions:
  contents: write
concurrency:
  group: social-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Post due items
        env:
          GH_TOKEN: ${{ github.token }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_DAILY_MAX: ${{ vars.YT_DAILY_MAX || '6' }}
          LATE_LIMIT_MIN: ${{ github.event.inputs.late_limit_min || '180' }}
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ github.event.inputs.only }}" ] && ARGS="$ARGS --only ${{ github.event.inputs.only }}"
          [ "${{ github.event.inputs.retry_failed }}" = "true" ] && ARGS="$ARGS --retry-failed"
          python3 social-post/post.py $ARGS
      - name: Keep the Threads token alive (Mondays)
        if: github.event_name == 'schedule'
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          [ -z "$THREADS_TOKEN" ] && exit 0
          if [ "$(TZ=Asia/Ho_Chi_Minh date +%u%H)" = "108" ]; then
            curl -s "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token=$THREADS_TOKEN" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('Threads token refreshed, expires in', d.get('expires_in'), 's' if 'expires_in' in d else d)"
          fi
