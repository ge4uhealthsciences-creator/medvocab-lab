<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Daily Medical English micro-lesson."><title>Daily Medical English | MedVocab Lab</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:850px;margin:0 auto;padding:24px;line-height:1.6;background:#f5f8fb;color:#152b3c}a{color:#0c7c86}.card{background:white;border:1px solid #dce5eb;border-radius:16px;padding:20px;margin:16px 0}.muted{color:#627487}.tag{display:inline-block;background:#dff4f2;padding:4px 9px;border-radius:99px;font-size:.85rem}li{margin:12px 0}h1{line-height:1.2}</style></head>
<body><p><a href="./">← MedVocab Lab</a></p><span class="tag">Daily lesson</span><h1 id="title">Loading today's lesson…</h1><p class="muted" id="meta"></p><section class="card"><h2>Learning objective</h2><p id="objective">Loading…</p></section><section class="card"><h2>Key vocabulary</h2><div id="vocab">Loading…</div></section><section class="card"><h2>Quick check</h2><p id="question"></p><div id="options"></div><p id="feedback" aria-live="polite"></p></section><p class="muted">Educational content only. Verify clinical details against authoritative references before using them in clinical practice.</p>
<script>
fetch('./data/daily-lesson.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error('not found');return r.json()}).then(d=>{
 document.getElementById('title').textContent=d.title||'Daily Medical English';document.getElementById('meta').textContent=(d.date||'')+' · '+(d.topic||'Medical English');document.getElementById('objective').textContent=d.objective||'';
 const v=document.getElementById('vocab');v.innerHTML='';(d.vocabulary||[]).forEach(x=>{const el=document.createElement('div');el.innerHTML='<h3></h3><p></p><p></p><p></p>';el.children[0].textContent=x.term+' · '+(x.ipa||'');el.children[1].textContent='Meaning: '+x.meaning;el.children[2].textContent='Definition: '+x.definition;el.children[3].textContent='Example: '+x.example;v.appendChild(el)});
 document.getElementById('question').textContent=d.quiz?.question||'Review the vocabulary above.';const opts=document.getElementById('options');(d.quiz?.options||[]).forEach(o=>{const b=document.createElement('button');b.textContent=o;b.style='display:block;margin:8px 0;padding:10px 14px;border:1px solid #b7c9d3;border-radius:9px;background:white;cursor:pointer';b.onclick=()=>{document.getElementById('feedback').textContent=o===d.quiz.answer?'Correct! '+(d.quiz.explanation||''):'Try again. Review the vocabulary and choose another answer.'};opts.appendChild(b)});
}).catch(()=>{document.getElementById('title').textContent='Daily lesson is not available yet';document.getElementById('meta').textContent='Run the GitHub Actions workflow once to generate the first lesson.';document.getElementById('objective').textContent='The workflow will publish a daily lesson after the repository is configured.';document.getElementById('vocab').textContent='No lesson data found.';document.getElementById('question').textContent='Please check the repository setup instructions.'});
</script></body></html>
