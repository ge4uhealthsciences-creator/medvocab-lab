<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GE4u English Ward</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#bfe0f0;font:15px/1.4 "Trebuchet MS","Segoe UI",sans-serif;color:#10283a;touch-action:none}
canvas{display:block}
.ov{touch-action:pan-y;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(16,40,58,.93);color:#fff;padding:16px;text-align:center;z-index:20;overflow:auto}
.ov h1{font-size:26px;line-height:1.15}.ov p{color:#a9c4d2;max-width:440px}
.big{background:#fff;color:#10283a;border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:16px;font-family:inherit;width:min(380px,92vw);cursor:pointer;text-align:left}
.big small{display:block;font-weight:400;color:#4b6475;font-size:12.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(380px,92vw)}
.grid button{background:#fff;border:0;border-radius:12px;padding:9px;font:inherit;font-size:14px;cursor:pointer;color:#10283a}
#hud{position:fixed;top:8px;left:8px;right:84px;background:rgba(255,255,255,.94);border-radius:12px;padding:8px 12px;font-size:14px;z-index:5}
#menuBtn{position:fixed;top:8px;right:8px;z-index:6;background:#10283a;color:#fff;border:0;border-radius:12px;padding:10px 12px;font:inherit}
#feed{position:fixed;right:8px;top:62px;width:210px;z-index:5;pointer-events:none}
#toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:#d7263d;color:#fff;border-radius:10px;padding:8px 12px;z-index:7;display:none;max-width:90vw;text-align:center}
#fade{position:fixed;inset:0;background:#10283a;opacity:0;pointer-events:none;transition:opacity .35s;z-index:30;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
#joy{position:fixed;left:18px;bottom:22px;width:120px;height:120px;border-radius:50%;background:rgba(16,40,58,.25);z-index:5;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(16,40,58,.75)}
#talk{position:fixed;right:18px;bottom:40px;z-index:6;display:none;background:#f5a30a;color:#10283a;border:0;border-radius:50px;padding:16px 20px;font-weight:700;font-size:16px;font-family:inherit;cursor:pointer}
#dlg{position:fixed;left:0;right:0;bottom:0;max-height:70vh;background:#fff;border-radius:18px 18px 0 0;padding:10px 12px 14px;z-index:15;display:none;overflow:auto;box-shadow:0 -6px 20px rgba(0,0,0,.3);touch-action:pan-y}
#st{display:none;flex-wrap:wrap;gap:4px 12px;font-size:13px;background:#10283a;color:#fff;border-radius:10px;padding:6px 10px;margin-bottom:6px;position:sticky;top:-10px;z-index:2}
.chip{background:#eaf1f4;border:0;border-radius:16px;padding:4px 10px;margin:0 4px 4px 0;font:inherit;font-size:13px;color:#10283a;cursor:pointer}
.b{display:flex;gap:8px;margin:6px 0;max-width:92%}.b.me{margin-left:auto;flex-direction:row-reverse}
.tx{background:#eaf1f4;border-radius:12px;padding:6px 10px}.me .tx{background:#d9f3e4}
.note{text-align:center;color:#8f1d2c;background:#fde8eb;border-radius:8px;font-size:13px;padding:4px 8px;margin:4px 0}
.note.find{color:#0b4f6c;background:#e3f2fd}.note.act{color:#7a4b00;background:#fff3d6;font-weight:700}.note.warn{color:#fff;background:#d7263d;font-weight:700}.note.warn2{color:#7a4b00;background:#fdebd0}.note.q{color:#10283a;background:#eef2f5;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #cfdce3;border-radius:12px;padding:9px 11px;margin-top:6px;font:inherit;color:#10283a;cursor:pointer}
.opt.act{background:#fff7e6;border-color:#f5a30a}.opt.go{background:#e8f8ef;border-color:#2a9d4a;font-weight:700}
.res{text-align:center;padding:8px}.res>b{font-size:30px;display:block}
.rep{background:#eef7f6;border:1px solid #bfe3df;border-radius:14px;padding:10px 12px;margin:6px 0}.rep .rl{font-size:12.5px;color:#0b6b6f;font-weight:700}.rep .rt{font-size:18px;font-weight:700;margin:6px 0 8px;line-height:1.35}.rep .rb{display:grid;grid-template-columns:1fr 1fr;gap:6px}.rep .rb .opt{margin:0;text-align:center}.rep .rb .go{grid-column:1/-1}
.spk{float:right;opacity:.75;padding-left:10px}.opt.mic{background:#eaf2ff;border-color:#2e86c1;font-weight:700;text-align:center}.sh{border:0;background:#fff;border-radius:10px;margin-left:6px;padding:2px 6px;cursor:pointer;font-size:12px}
.deb{text-align:left;font-size:13px;background:#f4f7f9;border-radius:10px;padding:8px 10px;margin-top:8px}.deb div{margin:3px 0}

/* ===== GE4u visual refresh ===== */
:root{--ink:#0e2433;--teal:#0b8f8f;--teal2:#14b8a6;--amber:#f5a524;--rose:#e5484d;--paper:#f6fafb;--glass:rgba(255,255,255,.92);--line:#d5e4ea}
html,body{font-family:"Plus Jakarta Sans","Trebuchet MS","Segoe UI",sans-serif;color:var(--ink)}
.ov{background:radial-gradient(1200px 600px at 20% -10%,#14b8a6 0%,transparent 55%),radial-gradient(900px 500px at 110% 110%,#2563eb 0%,transparent 55%),linear-gradient(160deg,#0b2a3c,#081b27);gap:12px}
.ov h1{font-weight:800;font-size:clamp(26px,6vw,36px);letter-spacing:-.01em;text-wrap:balance}
.ov p{color:#b8d3de;font-size:14.5px}
.big{background:var(--glass);border:1px solid rgba(255,255,255,.6);border-radius:18px;padding:14px 18px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:transform .15s,box-shadow .15s}
.big:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.25)}
.big:focus-visible,.opt:focus-visible,.chip:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.big small{color:#4a6676;margin-top:2px}
.grid button{background:var(--glass);border:1px solid rgba(255,255,255,.6);border-radius:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.12)}
#hud{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(14,36,51,.12);font-weight:600}
#menuBtn{background:var(--ink);border-radius:14px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.25)}
#talk{background:linear-gradient(135deg,#ffb84d,var(--amber));box-shadow:0 10px 24px rgba(245,165,36,.45);font-weight:800}
#joy{background:rgba(14,36,51,.18);border:2px solid rgba(255,255,255,.55)}#knob{background:var(--ink)}
#dlg{background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -12px 32px rgba(14,36,51,.22);padding:12px 14px 16px}
#st{background:var(--ink);border-radius:12px}
.chip{background:#e3f4f2;color:#0b5f5f;font-weight:600;border:1px solid #c5e9e4}
.tx{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.me .tx{background:#dff6ea;border-color:#bfe8d2}
.opt{border:1.5px solid var(--line);border-radius:14px;background:#fff;font-weight:500;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--teal2);background:#f0fbfa}
.opt.go{background:#e6f8ee;border-color:#2fa96a}.opt.act{background:#fff6e5;border-color:var(--amber)}
.note{border-radius:10px}
#toast{background:var(--rose);border-radius:12px;font-weight:700;box-shadow:0 8px 20px rgba(229,72,77,.35)}
@media (prefers-reduced-motion:reduce){.big,.opt{transition:none}.big:hover{transform:none}}
</style>
</head>
<body>
<div id="hud"></div><button id="menuBtn">☰ Menu</button><div id="toast"></div><div id="fade"></div>
<div id="joy"><div id="knob"></div></div><button id="talk">💬 Talk</button>
<div id="feed"></div>
<div id="dlg"><div id="st"></div><div id="voc"></div><div id="chat"></div><div id="opts"></div></div>
<div class="ov" id="lift" style="display:none"><h1>🛗 Elevator</h1><p>Which floor would you like to go to?</p><div id="liftBtns" style="display:flex;flex-direction:column;gap:8px;align-items:center"></div><button class="big" id="liftX" style="text-align:center">✖ Stay on this floor</button></div>
<div class="ov" id="menu">
  <h1>🏥 GE4u English Ward</h1>
  <p>Practise real hospital conversations in English. Move with WASD / arrow keys or the joystick, talk with E or the orange button.</p>
  <button class="big" id="mP">🛵 Visit as a patient<small>Park → reception → consultation → tests and scans → cashier → pharmacy or admission</small></button>
  <button class="big" id="mE">🚑 Emergency patient<small>Arrive by ambulance and go straight to the Emergency Department</small></button>
    <button class="big" id="mR">🎭 Play a health professional<small>Doctor in 15 specialties · Nurse · Midwife · Pharmacist · Dietitian · Epidemiologist · Social worker</small></button>
  <button class="big" id="mV" style="text-align:center"></button>
  <button class="big" id="mRep" style="text-align:center"></button>
  <button class="big" id="mEasy" style="text-align:center"></button>
  <button class="big" id="mK" style="text-align:center">🔧 Test speaker & microphone</button>
  <div id="diag" style="display:none;background:#fff;color:#10283a;border-radius:12px;padding:10px 12px;width:min(380px,92vw);text-align:left;font-size:14px"></div>
  <button class="big" id="mT">🚶 Explore the hospital<small>Walk freely around all 3 floors</small></button>
  <div class="grid" id="spGrid" style="display:none"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===================== DỮ LIỆU CA BỆNH ĐẦY ĐỦ =====================
// Mỗi ca: dept=khoa, er=1 nếu đến bằng xe cứu thương, o=[câu kể bệnh đúng, câu sai]
// h=[câu hỏi bệnh sử, trả lời đúng, trả lời sai ngữ pháp, 1=câu then chốt]
// x=[hành động khám, lời dặn tiếng Anh, việc bệnh nhân cần làm, kết quả khám, 1=then chốt]
// t={mã xét nghiệm: kết quả} — chỉ các xét nghiệm cần thiết; xét nghiệm khác trả "bình thường" và bị tính là thừa
// d=[câu giải thích chẩn đoán, đúng/sai, tên bệnh tiếng Việt, nhận xét], r=[kế hoạch điều trị, điểm 0-2, nhận xét]
// adm=1 nếu phải nhập viện, pq=[câu hỏi lại bác sĩ đúng, sai], tlim=phút "giờ vàng"
const CASES=[
{dept:'er',er:1,cc:'Ngã xe máy, đau cổ tay phải',who:'Mr. Khoa, 24',vit:{hr:96,bp:'125/80',sp:98,t:36.9},
 v:[['fracture','gãy xương'],['cast','bó bột'],['swelling','sưng'],['tetanus shot','tiêm uốn ván'],['pass out','ngất']],
 o:["I fell off my motorbike. My right wrist really hurts and I can't move it.","I fall from motorbike. My wrist hurt very and not move."],
 h:[["Did you hit your head or pass out?","I hit my helmet on the road, but I didn't pass out.","I hit head helmet but no faint.",1],
  ["Can you feel and move your fingers?","Yes, but they feel a bit numb.","Yes but numb a little they are.",1],
  ["When did you last have a tetanus shot?","I can't remember. Maybe ten years ago.","I not remember. Maybe ten year.",1],
  ["Are you allergic to any medication?","No, I'm not.","No allergy I.",0],
  ["When did you last eat?","I had breakfast at seven.","Breakfast at seven I eat.",0]],
 x:[['👁️ Kiểm tra tri giác, đồng tử (GCS)',"Look at my finger and follow it with your eyes.",'Nhìn theo ngón tay bác sĩ','GCS 15, đồng tử đều, phản xạ ánh sáng tốt — không có dấu hiệu chấn thương sọ não.',1],
  ['✋ Khám cổ tay phải',"Let me look at your wrist. Tell me where it hurts most.",'Đưa cổ tay cho bác sĩ xem','Cổ tay biến dạng hình "lưng dĩa", sưng nề, ấn đau chói đầu dưới xương quay.',1],
  ['🩸 Kiểm tra mạch và cảm giác ngón tay',"Can you wiggle your fingers for me?",'Cử động các ngón tay','Mạch quay bắt rõ, cảm giác ngón tay giảm nhẹ.',1],
  ['🩹 Rửa vết trầy',"I'm going to clean this scrape. It may sting a little.",'Giữ yên để rửa vết thương','Trầy xước nông ở khuỷu tay, đã sát khuẩn.',0]],
 t:{xr:'X-quang cổ tay: gãy đầu dưới xương quay di lệch (gãy Pouteau-Colles).'},
 d:[["You have a broken wrist. It's a fracture at the end of the forearm bone.",1,'Gãy đầu dưới xương quay'],["It's just a bad sprain.",0,'Bong gân cổ tay','Biến dạng + đau chói + X-quang có gãy → không phải bong gân.'],["You have a head injury.",0,'Chấn thương sọ não','Khám thần kinh bình thường.']],
 r:[["We'll straighten the bone under local anesthetic, put on a cast, and give you a tetanus shot.",2,''],["Put some ice on it and go home.",0,'Gãy di lệch phải nắn và bó bột.'],["You need major surgery right now.",1,'Thường nắn kín và bó bột trước.']],
 pq:["How long will I need to wear the cast?","How long I must wear cast?"]},

{dept:'er',er:1,cc:'Méo miệng, yếu tay phải, nói khó',who:'Mr. Hung, 68',vit:{hr:88,bp:'185/100',sp:96,t:36.9},tlim:25,worse:{bp:'195/105'},
 v:[['stroke','đột quỵ'],['weakness','yếu liệt'],['slurred speech','nói ngọng'],['clot-busting drug','thuốc tiêu huyết khối'],['last seen normal','lần cuối bình thường']],
 o:["My right arm feels heavy... and my words come out strange.","My arm right heavy... word strange."],
 h:[["What time were you last completely normal?","At nine o'clock, about an hour ago. My wife saw it start.","At nine, one hour ago. Wife see.",1],
  ["Do you take any blood thinners?","No, only blood pressure tablets.","No, only tablet blood pressure.",1],
  ["Have you had any recent surgery or bleeding?","No, nothing like that.","No have.",1],
  ["Do you have diabetes?","No, I don't.","No.",0]],
 x:[['🙂 Đánh giá FAST (mặt – tay – lời nói)',"Smile for me, raise both arms, and say 'It's a sunny day'.",'Cười, giơ hai tay, nói một câu','Méo miệng phải, tay phải rơi xuống, nói ngọng — FAST dương tính.',1],
  ['🩸 Thử đường huyết mao mạch',"Just a small prick on your finger.",'Đưa ngón tay để chích máu','Đường huyết 6,4 mmol/L — loại trừ hạ đường huyết.',1],
  ['🧠 Khám thần kinh chi tiết (NIHSS)',"Follow my instructions as best you can.",'Làm theo hướng dẫn','NIHSS 8 điểm.',0]],
 t:{ct:'CT sọ não không cản quang: không xuất huyết, chưa thấy ổ nhồi máu rõ.'},
 d:[["You're having a stroke. A blood clot is blocking blood flow to part of your brain.",1,'Đột quỵ nhồi máu não'],["It's a bleed in the brain.",0,'Xuất huyết não','CT không có xuất huyết.'],["It's just low blood sugar.",0,'Hạ đường huyết','Đường huyết bình thường.']],
 r:[["We'll give a clot-busting medicine through a drip right now and admit you to the stroke unit.",2,''],["Let's wait and see if it gets better.",0,'Mỗi phút chậm trễ mất khoảng 2 triệu tế bào thần kinh.'],["Take aspirin and go home.",0,'Cần tiêu huyết khối trong cửa sổ 4,5 giờ và nhập viện.']],
 adm:1,pq:["Will I be able to move my arm again?","I can move my arm again?"]},

{dept:'card',cc:'Khó thở khi nằm, phù hai chân',who:'Mr. Nam, 67',vit:{hr:102,bp:'145/90',sp:92,t:36.7},
 v:[['breathless','khó thở'],['swollen ankles','phù cổ chân'],['heart failure','suy tim'],['water pill','thuốc lợi tiểu'],['echocardiogram','siêu âm tim']],
 o:["I get breathless, especially at night when I lie down. My ankles are swollen too.","I breath short at night when lie down. My ankle swell also."],
 h:[["How many pillows do you need to sleep?","Three. If I lie flat, I can't breathe.","Three. Lie flat I cannot breath.",1],
  ["Have you ever had a heart attack?","Yes, five years ago. I had a stent.","Yes five year ago, stent I have.",1],
  ["Have you gained weight recently?","About three kilos in two weeks.","Three kilo in two week about.",1],
  ["Are you taking your medicines every day?","I stopped my water pill last month. It made me pee too much.","I stop water pill last month because pee many.",1],
  ["Do you have chest pain?","No, just tightness when I walk.","No, only tight when walk.",0]],
 x:[['🩺 Nghe phổi',"Please breathe in and out slowly through your mouth.",'Thở chậm bằng miệng','Ran ẩm hai đáy phổi.',1],
  ['🫀 Nghe tim',"Hold still. I'm listening to your heart.",'Ngồi yên','Tim nhanh, có tiếng ngựa phi (T3).',1],
  ['🦵 Ấn phù cổ chân',"Let me press on your ankles.",'Duỗi chân cho bác sĩ ấn','Phù ấn lõm hai cẳng chân.',1],
  ['👀 Xem tĩnh mạch cổ',"Please turn your head to the left.",'Quay đầu sang trái','Tĩnh mạch cổ nổi ở tư thế 45°.',0]],
 t:{xr:'X-quang ngực: bóng tim to, sung huyết phổi, tràn dịch màng phổi ít hai bên.',bnp:'NT-proBNP 4.800 pg/mL (tăng cao).',us:'Siêu âm tim: phân suất tống máu (EF) 30%, giảm vận động thành dưới.',ecg:'ECG: nhịp nhanh xoang, sóng Q cũ thành dưới.'},
 d:[["Your heart isn't pumping strongly enough. This is heart failure, and fluid is building up in your lungs and legs.",1,'Suy tim'],["You have a chest infection.",0,'Viêm phổi','Không sốt, BNP cao, tim to → suy tim.'],["It's asthma.",0,'Hen phế quản','Ran ẩm + phù + BNP cao không phải hen.']],
 r:[["We'll admit you, give water pills through a drip, and adjust your heart medicines. After that, weigh yourself every morning.",2,''],["Take antibiotics for a week.",0,'Không phải nhiễm trùng.'],["Just eat less salt.",1,'Cần lợi tiểu và chỉnh thuốc, không chỉ ăn nhạt.']],
 adm:1,pq:["Can I stop the water pill when the swelling goes down?","Can I stop water pill when swelling go down?"]},

{dept:'ped',cc:'Bé 4 tuổi ho, sốt, thở nhanh',who:'Mẹ bé Na (Ms. Lan)',pic:'👩',vit:{hr:140,bp:'—',sp:94,t:39.1},
 v:[['pneumonia','viêm phổi'],['breathing fast','thở nhanh'],['vaccinations','tiêm chủng'],['antibiotic syrup','siro kháng sinh'],['chest indrawing','rút lõm lồng ngực']],
 o:["My daughter is four. She's had a fever and a cough for three days, and now she's breathing very fast.","My daughter four year. Fever and cough three day, now breath very fast."],
 h:[["Is she eating and drinking normally?","She's drinking a little, but she won't eat.","She drink little, not eat.",1],
  ["Is she up to date with her vaccinations?","Yes, all of them.","Yes, all vaccine she has.",1],
  ["Has she been very sleepy or hard to wake?","No, she's tired but awake.","No, tired but she awake.",1],
  ["Is anyone else at home sick?","Her brother had a cold last week.","Her brother have cold last week.",0],
  ["Have you given her any medicine?","Paracetamol four hours ago.","Paracetamol before four hour.",0]],
 x:[['⏱️ Đếm nhịp thở 1 phút',"Can she sit quietly on your lap for a minute?",'Bế con ngồi yên trên đùi','Nhịp thở 48 lần/phút — thở nhanh so với tuổi.',1],
  ['🩺 Nghe phổi',"Sweetie, can you take big breaths for me?",'Bảo bé hít thở sâu','Ran nổ đáy phổi phải, rì rào phế nang giảm.',1],
  ['👕 Quan sát lồng ngực',"Could you lift up her shirt, please?",'Vén áo bé lên','Không rút lõm lồng ngực.',1],
  ['👄 Khám họng',"Open wide and say 'aah'.",'Há miệng nói "a"','Họng đỏ nhẹ.',0]],
 t:{xr:'X-quang ngực: đông đặc thùy dưới phổi phải.',cbc:'Bạch cầu 18.500/mm³, ưu thế trung tính.',crp:'CRP 65 mg/L (tăng).'},
 d:[["She has a chest infection called pneumonia in the lower part of her right lung.",1,'Viêm phổi'],["It's just a common cold.",0,'Cảm lạnh thông thường','Thở nhanh + ran nổ + đông đặc là viêm phổi.'],["She has asthma.",0,'Hen phế quản','Không khò khè, có sốt và đông đặc.']],
 r:[["She can take antibiotic syrup at home for five days. Come back at once if she breathes harder or stops drinking.",2,''],["No medicine is needed. It will go away.",0,'Viêm phổi do vi khuẩn cần kháng sinh.'],["She must stay in intensive care.",1,'SpO₂ 94%, không rút lõm → điều trị ngoại trú, hẹn tái khám.']],

// ice = nỗi lo của người bệnh: [câu đúng, câu sai ngữ pháp, bác sĩ đáp tốt, bác sĩ đáp kém, nhận xét]
// fu  = câu hỏi sau khi nghe điều trị: [câu hỏi đúng, câu hỏi sai, bác sĩ trả lời tốt, trả lời kém, nhận xét]
const EXT={};
const E=(who,ice,fu)=>EXT[who]={ice,fu};
E('Mr. Khoa, 24',["I'm a delivery driver. I'm worried I won't be able to work.","I delivery driver. I worry cannot work.","That's a real worry. Most people can ride again after six to eight weeks, and I'll write a note for your employer.","You'll have to find another job.",'Thừa nhận nỗi lo và đưa thông tin cụ thể.'],
 [["How long will I need to wear the cast?","How long I must wear cast?","Usually about six weeks. We'll take another X-ray in one week to make sure the bone stays in place.","Until it's better.",'Trả lời cụ thể thời gian và kế hoạch theo dõi.'],
  ["What should I watch out for at home?","What I should watch at home?","If your fingers become numb, very swollen or blue, or the pain gets much worse, come back straight away. The cast may be too tight.","Nothing, just rest.",'Dặn dấu hiệu chèn ép trong bột.']]);
E('Mr. Hung, 68',["I'm scared I'll end up in a wheelchair like my brother.","I scared I end in wheelchair like my brother.","I understand. We're treating you early, which gives you the best chance of recovering movement.","Let's not think about that.",'Ghi nhận nỗi sợ và nhấn mạnh lợi ích điều trị sớm.'],
 [["Are there any risks with the clot-busting medicine?","The clot-busting medicine has any risk?","Yes, there's a small risk of bleeding, including in the brain. We'll watch you closely, but the benefit is much greater than the risk.","No risks at all.",'Trung thực về nguy cơ chảy máu.'],
  ["Will I be able to move my arm again?","I can move my arm again?","Many people improve a lot, especially with early treatment and physiotherapy. We'll know more over the next few days.","Probably not.",'Hy vọng thực tế, không hứa hẹn quá mức.']]);
E('Mr. Nam, 67',["I'm worried my heart is getting worse and I'll die soon.","I worry my heart worse and I die soon.","That's a very natural worry. Heart failure is serious, but with the right medicines many people live well for years.","Everyone dies sometime.",'Đồng cảm và đưa thông tin cân bằng.'],
 [["Can I stop the water pill when the swelling goes down?","Can I stop water pill when swelling go down?","Please don't stop it on your own. It keeps fluid off your lungs. If it makes you pee too much, we can change the timing.","Yes, stop whenever you like.",'Giải thích lý do duy trì thuốc và cách khắc phục tác dụng phụ.'],
  ["Why do I need to weigh myself every day?","Why I need weigh myself every day?","A sudden gain of two kilos in three days usually means fluid is building up again, so you can call us early.","Just because.",'Giải thích ý nghĩa theo dõi cân nặng.']]);
E('Mẹ bé Na (Ms. Lan)',["I'm scared she'll stop breathing at night.","I scared she stop breathing at night.","I understand. Her oxygen level is okay now, and I'll tell you exactly which signs mean you should come back straight away.","She'll be fine. Don't be silly.",'Không coi nhẹ nỗi lo của phụ huynh.'],
 [["What warning signs should I watch for at night?","What sign I watch at night?","Come back straight away if she breathes faster or harder, her lips look blue, she stops drinking, or she's very hard to wake.","Just watch her.",'Dặn dấu hiệu nguy hiểm cụ thể.'],
  ["Can she go to kindergarten?","She can go kindergarten?","Keep her at home until her fever has gone for at least a day and she's eating well again.","Yes, tomorrow is fine.",'Hướng dẫn thời điểm đi học lại.']]);
E('Ms. Thu, 35',["I'm terrified of dentists. Will it hurt?","I terrified dentist. It will hurt?","Many people feel that way. I'll numb the area well, explain each step, and you can raise your hand any time to stop.","It won't hurt. Stop worrying.",'Trấn an và trao quyền kiểm soát cho người bệnh.'],
 [["Will I need to come back to finish the treatment?","I need come back finish treatment?","Yes. A root canal usually takes two or three visits, then a crown to protect the tooth.","Maybe.",'Nói rõ số lần hẹn.'],
  ["Can I eat normally tonight?","I can eat normal tonight?","Wait until the numbness wears off, then eat soft food and chew on the other side.","Eat what you like.",'Dặn dò sau thủ thuật.']]);
E('Mrs. Hanh, 62',["Am I going to go blind?","I am going blind?","That's why we're acting quickly. If we lower the pressure now, there's a good chance of saving your sight.","Possibly. We'll see.",'Thông tin trung thực kèm hy vọng.'],
 [["Why do you need to treat my other eye too?","Why you need treat other eye also?","Your other eye has the same narrow drainage angle, so the laser prevents the same attack happening there.","Just in case.",'Giải thích lý do điều trị dự phòng mắt còn lại.'],
  ["Is there anything I should avoid?","Anything I should avoid?","Avoid medicines that widen the pupils, like some cold or allergy tablets, until the laser is done. Always tell pharmacists you have narrow angles.","No, nothing.",'Dặn thuốc cần tránh.']]);
E('Mr. Binh, 70',["My friend still has pain years after shingles. Will that happen to me?","My friend still pain years after shingles. It happen to me?","It can happen, especially as we get older. Starting antiviral tablets early lowers that risk, and we can treat nerve pain if it continues.","No, never.",'Thông tin chính xác về đau sau zona.'],
 [["Can I pass this on to my grandchildren?","Can I give this for my grandchildren?","They can catch chickenpox from the fluid in the blisters if they haven't had it or the vaccine. Keep the rash covered until it crusts over.","No, it's impossible.",'Hướng dẫn phòng lây.'],
  ["Is there a vaccine to stop it coming back?","Have vaccine to stop it come back?","Yes, there's a shingles vaccine. We can talk about it once this episode has healed.","No.",'Tư vấn dự phòng.']]);
E('Mr. Phuc, 45',["I'm worried I'll need an operation and lose my job.","I worry I need operation and lose job.","Most people with this get better without surgery in six to twelve weeks. Let's talk about light duties at work for now.","You probably will.",'Thông tin tiên lượng giúp giảm lo âu.'],
 [["Which movements should I avoid?","Which movement I should avoid?","Avoid heavy lifting and long periods of sitting. Gentle walking is good, and the physiotherapist will show you exercises.","Don't move at all.",'Hướng dẫn vận động hợp lý.'],
  ["When should I come back urgently?","When I should come back urgent?","If you have numbness between your legs, trouble passing urine, or weakness getting worse, come to the emergency department straight away.","If it still hurts next year.",'Dặn dấu hiệu hội chứng chùm đuôi ngựa.']]);
E('Mr. Sang, 72',["I'm scared I'll bleed to death.","I scared I bleed to death.","I understand. We'll stop the bleeding now, and your blood count is still okay, so you're not in danger.","It's just a nosebleed.",'Trấn an kèm thông tin cụ thể.'],
 [["Should I take my blood pressure tablet now?","I should take blood pressure tablet now?","Yes, please take it now. High blood pressure can make nosebleeds worse.","No, skip it.",'Hướng dẫn thuốc đúng.'],
  ["What if it starts bleeding again at home?","What if it bleed again at home?","Lean forward and pinch the soft part of your nose for ten minutes. If it doesn't stop in twenty minutes, come back.","Tilt your head back.",'Dạy sơ cứu đúng.']]);
E('Ms. Lien, 50',["My mother lost a leg to diabetes. Will that happen to me?","My mother lose leg because diabetes. It happen to me?","I'm so sorry about your mother. With good sugar control and checking your feet every day, we can greatly lower that risk.","Maybe. It runs in families.",'Đồng cảm và nhấn mạnh khả năng phòng ngừa.'],
 [["Do I need to check my sugar at home?","I need check sugar at home?","With metformin alone, you don't need daily checks. We'll check your HbA1c every three months instead.","Ten times a day.",'Hướng dẫn theo dõi phù hợp.'],
  ["What side effects does metformin have?","Metformin has what side effect?","Some people get an upset stomach at first. Taking it with food helps, and it usually settles in a couple of weeks.","None at all.",'Tư vấn tác dụng phụ.']]);
E('Ms. Ngoc, 29',["Is my baby going to be okay?","My baby will be okay?","The baby's heartbeat and growth look good right now. Treating your blood pressure is the best way to protect both of you.","I can't say anything.",'Thông tin cập nhật về thai và lý do điều trị.'],
 [["Will my baby be born early?","My baby will born early?","Possibly. If your condition gets worse, delivering early may be the safest option. That's why we're giving steroids for the baby's lungs.","No, definitely not.",'Trung thực về khả năng sinh non.'],
  ["What's the magnesium for?","Magnesium is for what?","It helps prevent seizures, which can happen with severe preeclampsia. You might feel warm when it starts.","It's a vitamin.",'Giải thích mục đích và cảm giác khi truyền.']]);
E('Ms. Vy, 26',["I'm scared it's a brain tumour.","I scared it is brain tumour.","That's a common worry. Your examination is completely normal, and your symptoms fit migraine very well.","It could be. Who knows?",'Trấn an dựa trên bằng chứng.'],
 [["Is it safe to keep taking my pill?","It is safe keep taking my pill?","Because you have aura, the combined pill increases your stroke risk. A progestogen-only pill or an IUD is safer.","Yes, no problem.",'Tư vấn tránh thai an toàn.'],
  ["How often can I take the triptan?","How often I can take triptan?","At the start of a headache, and you can repeat after two hours if needed, but no more than two days a week.","Whenever you like.",'Tránh lạm dụng thuốc.']]);
E('Mr. Quang, 55',["Is this cancer?","This is cancer?","It looks like an ulcer, which is common and treatable. We'll take biopsies during the endoscopy to be sure.","Maybe. We'll see.",'Thông tin rõ ràng, giải thích sinh thiết.'],
 [["What can I take for my knee pain instead?","What I can take for knee pain instead?","Paracetamol is safer for your stomach. A physiotherapist can also help your knee.","More ibuprofen.",'Thay thế an toàn cho NSAID.'],
  ["How long will I stay in hospital?","How long I stay in hospital?","Usually a few days, until the bleeding has stopped and your blood count is stable.","No idea.",'Thông tin thời gian nằm viện.']]);
E('Mr. Tam, 64',["I can't breathe. Am I going to die?","I cannot breathe. I am going to die?","You're struggling, and we're treating you now. Most people improve within a few hours of the nebulisers.","Calm down.",'Đáp lại nỗi sợ khó thở.'],
 [["Can you help me quit smoking?","You can help me quit smoke?","Absolutely. Stopping is the most important thing for your lungs. We can start nicotine patches and refer you to our stop-smoking service.","Just stop.",'Hỗ trợ cai thuốc cụ thể.'],
  ["How do I use the inhaler properly?","How I use inhaler properly?","Breathe out, seal your lips around it, press as you breathe in slowly, then hold your breath for ten seconds. A spacer makes it easier.","Just spray it.",'Dạy kỹ thuật dùng bình xịt.']]);
E('Ms. Huong, 31',["I thought I was going crazy. I've been so anxious.","I think I go crazy. I so anxious.","You're not going crazy. The thyroid hormone is causing the anxiety and racing heart, and treatment will help.","It's all in your head.",'Bình thường hóa triệu chứng, giải thích nguyên nhân.'],
 [["Is it safe to get pregnant while I'm taking this tablet?","It is safe to pregnant when take this tablet?","Please use contraception for now. If you're planning a pregnancy, tell me, because we may switch to a safer medicine.","Yes, no problem.",'Tư vấn an toàn thai kỳ.'],
  ["What side effects should I watch for?","What side effect I watch?","If you get a sore throat or fever, stop the tablet and get a blood test straight away. It can rarely lower your white cells.","None.",'Dặn tác dụng phụ nguy hiểm (giảm bạch cầu hạt).']]);
E('Mr. Duc, 19',["I've never had an operation. I'm really nervous.","I never have operation. I really nervous.","That's completely normal. It's a very common operation, and the anaesthetist will see you first to answer your questions.","It's nothing. Don't be a baby.",'Trấn an, không coi thường.'],
 [["Will it be keyhole surgery?","It will be keyhole surgery?","Yes, usually. We make three small cuts, and most people go home in a day or two.","I don't know.",'Giải thích phương pháp mổ.'],
  ["When can I play sport again?","When I can play sport again?","Light activity in a week, and contact sport after about four weeks.","Tomorrow.",'Hướng dẫn phục hồi.']]);
E('Ms. Trang, 22',["Am I going to die?","I am going to die?","You're having a serious reaction, but the adrenaline works quickly, and we're right here with you.","Maybe.",'Trấn an trong cấp cứu.'],
 [["Will I need to carry an EpiPen from now on?","I need carry EpiPen from now?","Yes. I'll show you how to use it, and you should always carry two and avoid all shellfish.","No, you'll be fine.",'Kế hoạch dự phòng phản vệ.'],
  ["Why do I have to stay for six hours?","Why I must stay six hours?","Sometimes the reaction comes back a few hours later, so we need to watch you.","Hospital rules.",'Giải thích phản ứng hai pha.']]);
E('Mrs. Kim, 66',["My sister had a stroke. Could that happen to me?","My sister have stroke. It could happen to me?","Atrial fibrillation does raise stroke risk, which is exactly why the blood thinner is so important.","Probably not.",'Kết nối nỗi lo với lý do điều trị.'],
 [["Will I need to take the blood thinner for life?","I must take blood thinner all life?","Most likely, yes, because your stroke risk stays high. We'll review it every year.","Just a week.",'Thông tin thời gian điều trị.'],
  ["What should I do if I start bleeding?","What I do if I start bleeding?","Small bruises are common. But if you see blood in your urine or stools, or vomit blood, come in straight away.","Ignore it.",'Dặn dấu hiệu chảy máu.']]);
E('Bố bé Minh (Mr. Hai)',["Does he have to give the cat away?","He must give cat away?","Not necessarily. Keep the cat out of his bedroom, wash his bedding weekly, and we'll see how his asthma does.","Yes, immediately.",'Tư vấn thực tế, giảm tiếp xúc dị nguyên.'],
 [["How do I know when to bring him back to hospital?","How I know when bring him back hospital?","If the inhaler doesn't help for four hours, he can't speak in sentences, or his lips look blue, call an ambulance.","When he coughs.",'Dặn dấu hiệu cơn hen nặng.'],
  ["Is the steroid medicine safe for a child?","Steroid medicine safe for child?","A short three-day course is very safe and helps the airways settle quickly.","No, it's dangerous.",'Giải đáp lo ngại về corticoid.']]);
E('Mr. Long, 22',["I'm worried the surgery will damage the nerve.","I worry surgery damage the nerve.","That's a fair question. The risk is low, and if the X-ray shows the root is very close, we can do a CT scan first.","There's no risk.",'Trung thực về nguy cơ.'],
 [["Is it safe to remove the tooth so close to the nerve?","It is safe remove tooth near nerve?","Usually yes. There's a small risk of temporary numbness of the lip. Permanent numbness is rare.","Totally safe.",'Tư vấn nguy cơ trước thủ thuật.'],
  ["How should I use the mouthwash?","How I should use mouthwash?","Rinse twice a day for one minute after brushing, and don't eat or drink for thirty minutes afterwards.","Drink it.",'Hướng dẫn dùng nước súc miệng.']]);
E('Mr. Son, 58',["I drive a taxi. Will I lose my job?","I drive taxi. I will lose job?","You mustn't drive until we've treated this and checked your vision. Many people can return to work afterwards.","Yes, you will.",'Trung thực, có hướng xử lý.'],
 [["Will my sight come back completely?","My sight will come back complete?","Because the centre of your retina is still attached, there's a good chance of keeping your central vision.","No.",'Tiên lượng cụ thể.'],
  ["How will I need to lie after surgery?","How I need lie after surgery?","If we use a gas bubble, you may need to keep your head in a certain position for about a week. You also mustn't fly.","Any position.",'Dặn tư thế và tránh đi máy bay.']]);
E('Mr. Hoang, 60',["I'm worried I'll lose my leg like my uncle.","I worry I lose my leg like my uncle.","That's a natural worry with diabetes. Treating this early with antibiotics and controlling your sugar makes that very unlikely.","It could happen.",'Đồng cảm, thông tin cân bằng.'],
 [["How can I stop this from happening again?","How I stop this happen again?","Check your feet every day, keep the skin between your toes dry, use the antifungal cream, and keep your sugar under control.","Pray.",'Dặn dự phòng tái phát.'],
  ["Why do you draw a line on my leg?","Why you draw line on my leg?","So we can see if the redness spreads beyond it. If it does, we may need to change the antibiotics.","No reason.",'Giải thích mục đích đánh dấu.']]);
E('Mrs. Sau, 82',["I don't want to be a burden on my daughter.","I don't want be burden to my daughter.","I understand. After the operation, physiotherapy will help you walk again, and our social worker can help plan support at home.","You will be.",'Ghi nhận cảm xúc, nói về hỗ trợ.'],
 [["When will I be able to walk again?","When I can walk again?","Usually the day after surgery, with a frame and the physiotherapist's help.","In six months.",'Thông tin phục hồi sớm.'],
  ["Is the operation dangerous at my age?","Operation dangerous at my age?","Every operation has risks, but staying in bed is riskier. The anaesthetist will check your heart and lungs first.","No risk at all.",'Cân bằng nguy cơ – lợi ích.']]);
E('Mr. Phong, 25',["I can't eat or drink. I'm so hungry and thirsty.","I cannot eat or drink. I so hungry thirsty.","That must be miserable. Once the pus is drained, swallowing usually gets much easier within hours, and we'll give fluids through a drip now.","That's normal.",'Đồng cảm và giải quyết nhu cầu.'],
 [["Will I need my tonsils taken out later?","I will need tonsils taken out later?","If this happens again, or you get frequent tonsillitis, we'd recommend removing them.","Yes, tomorrow.",'Tư vấn chỉ định cắt amidan.'],
  ["Will draining it hurt?","Draining it will hurt?","I'll numb your throat first. You'll feel pressure, and most people feel relief straight afterwards.","Yes, a lot.",'Chuẩn bị tâm lý trước thủ thuật.']]);
E('Ms. Hanh, 38',["I thought I was just lazy. Everyone says I'm always tired.","I think I just lazy. Everyone say I always tired.","You're not lazy. Low iron really does cause tiredness, and you should feel better within a few weeks of treatment.","Maybe you are.",'Xác nhận triệu chứng, không phán xét.'],
 [["Will the iron tablets upset my stomach?","Iron tablet will upset my stomach?","They can cause constipation or stomach upset. Taking them every other day can help, and they'll make your stools dark.","No.",'Tư vấn tác dụng phụ của sắt.'],
  ["Which foods have a lot of iron?","Which food have many iron?","Tofu, beans, dark green vegetables and fortified cereals. Having fruit with them helps absorption, but avoid tea with meals.","Rice.",'Tư vấn dinh dưỡng phù hợp người ăn chay.']]);
E('Ms. Thao, 27',["Did I do something wrong to cause this?","I did something wrong cause this?","No, this isn't your fault. Ectopic pregnancies often happen because of earlier tube damage, not anything you did.","Maybe.",'Giảm cảm giác tội lỗi.'],
 [["Will I be able to get pregnant again?","I can get pregnant again?","Yes, most women can. Your other tube can still work, and next time we'll do an early scan to check where the pregnancy is.","No.",'Thông tin về khả năng sinh sản.'],
  ["How long will I be in hospital?","How long I be in hospital?","Usually a day or two after keyhole surgery.","A month.",'Thông tin nằm viện.']]);
E('Mr. Tuan, 35',["I'm embarrassed to go out with my face like this.","I embarrassed go out with face like this.","That's completely understandable. Most people recover, and you're welcome to take some time off work.","It's not a big deal.",'Đồng cảm với ảnh hưởng tâm lý.'],
 [["Why do I need to protect my eye?","Why I need protect my eye?","Because it can't close properly, it can dry out and get scratched, which could damage your vision.","Just because.",'Giải thích nguy cơ loét giác mạc.'],
  ["How long until my face gets better?","How long until my face better?","Most people start improving within three weeks, and many recover fully in three to six months.","Never.",'Tiên lượng cụ thể.']]);
E('Mr. Vinh, 45',["I'm worried my wife will be angry about the drinking.","I worry my wife angry about drinking.","It sounds like the drinking has been worrying you both. We can offer support to help you cut down, if you'd like.","That's your problem.",'Mở cơ hội tư vấn rượu.'],
 [["Can I ever drink alcohol again?","I can drink alcohol again ever?","After pancreatitis caused by alcohol, it's safest never to drink again. Another attack could be more serious.","Yes, just less.",'Tư vấn bỏ rượu.'],
  ["When can I eat again?","When I can eat again?","Once the pain improves, usually in a day or two, you can start with light food.","In a month.",'Hướng dẫn cho ăn lại sớm.']]);
E('Mr. Kien, 21',["Will it happen again?","It will happen again?","It can, in about one in three people, especially if you keep smoking. Stopping smoking really lowers that risk.","No, never.",'Thông tin nguy cơ tái phát.'],
 [["Is it safe to fly after this?","It is safe to fly after this?","Not yet. You'll need to wait until an X-ray shows it has fully healed, usually at least one to two weeks.","Yes, tomorrow.",'Dặn kiêng đi máy bay.'],
  ["Can I go diving?","I can go diving?","Diving isn't recommended after a pneumothorax unless you have surgery to prevent it happening again.","Sure.",'Dặn kiêng lặn.']]);
E('Ms. Nga, 45',["I've been feeling so low. I thought it was depression.","I feel so low. I think it is depression.","An underactive thyroid can definitely cause low mood. Let's treat it and see how you feel, and we'll keep checking your mood.","Just think positively.",'Ghi nhận tâm trạng, liên hệ bệnh lý.'],
 [["Will I need to take it for the rest of my life?","I need take it rest of my life?","Most likely, yes. It replaces the hormone your thyroid can't make, and it's a very safe tablet.","Just a month.",'Thông tin điều trị thay thế lâu dài.'],
  ["How should I take it?","How I should take it?","Every morning on an empty stomach with water, thirty minutes before breakfast or coffee.","With your coffee.",'Hướng dẫn uống thuốc đúng.']]);
E('Ms. Phuong, 48',["I've got two children to look after. How long will I be away?","I have two children to look after. How long I away?","That's a real concern. With keyhole surgery, most people are home in a day or two and back to normal activities in about two weeks.","As long as it takes.",'Thông tin cụ thể cho kế hoạch gia đình.'],
 [["Can I live normally without a gallbladder?","I can live normal without gallbladder?","Yes. Some people find very fatty meals upset their stomach for a while, but most live completely normally.","No.",'Giải đáp đời sống sau cắt túi mật.'],
  ["What can I eat while I'm waiting for surgery?","What I can eat while waiting surgery?","Small, low-fat meals. Avoid fried food until after the operation.","Anything.",'Hướng dẫn ăn uống trước mổ.']]);
E('Mr. Quoc, 52',["My father had a stroke at sixty. I'm afraid the same thing will happen to me.","My father have stroke at sixty. I afraid same thing happen to me.","That's a very understandable worry. Controlling your blood pressure is the most effective way to lower your stroke risk.","It probably will.",'Kết nối nỗi lo với lợi ích điều trị.'],
 [["Can I stop the tablets once my blood pressure is normal?","Can I stop tablet when blood pressure normal?","No. The tablet is what keeps it normal. If you stop, it will usually go back up.","Yes, of course.",'Giải thích điều trị lâu dài.'],
  ["What blood pressure should I aim for at home?","What blood pressure I aim at home?","Below one thirty-five over eighty-five at home. Write down your readings and bring them next time.","Whatever.",'Mục tiêu huyết áp cụ thể.']]);
E('Mẹ bé Tí (Ms. Hong)',["I thought he was dying. I was so scared.","I think he dying. I so scared.","That must have been terrifying to watch. Febrile seizures look frightening, but they don't usually cause any lasting harm.","Calm down. It's nothing.",'Ghi nhận cảm xúc của phụ huynh.'],
 [["Will this damage his brain?","This will damage his brain?","No. Simple febrile seizures don't cause brain damage or affect his development.","Maybe.",'Trấn an dựa trên bằng chứng.'],
  ["Will it happen again?","It will happen again?","About one in three children have another one during a fever. Most grow out of them by age six.","Never.",'Tiên lượng chính xác.']]);
E('Bố bé Nam (Mr. Hai)',["I feel terrible. I wasn't watching him.","I feel terrible. I not watching him.","Accidents happen so quickly, even with careful parents. Keeping the tooth in milk was exactly the right thing to do.","You should have been.",'Giảm cảm giác tội lỗi, khen hành động đúng.'],
 [["Will the tooth stay alive?","The tooth will stay alive?","We have a good chance because you acted quickly. He'll need check-ups and possibly a root canal later.","Definitely.",'Tiên lượng thực tế.'],
  ["What can he eat this week?","What he can eat this week?","Soft food only for two weeks, and he should brush gently with a soft toothbrush.","Anything.",'Dặn chăm sóc sau cắm lại răng.']]);
E('Ms. Yen, 24',["I have an important exam next week. Will my eye be okay?","I have important exam next week. My eye okay?","With the drops every hour, most ulcers improve in a few days. I can write a letter for your university if you need extra time.","Forget the exam.",'Hỗ trợ thực tế.'],
 [["Will I be able to wear contact lenses again?","I can wear contact lens again?","Yes, once it's fully healed. But never sleep or swim in them, and never rinse them with tap water.","Never.",'Dạy vệ sinh kính áp tròng.'],
  ["Do I really have to put drops in at night?","I really must put drops at night?","Yes, for the first two days. The infection can damage your eye quickly, so it's very important.","Only if you wake up.",'Nhấn mạnh tuân thủ.']]);
E('Mr. Trung, 55',["My brother died of cancer. Is that what this is?","My brother die of cancer. This is that?","I'm so sorry about your brother. I can't be sure until we test it, but if it is melanoma, finding it early gives the best chance of cure.","Probably.",'Báo tin xấu tế nhị, trung thực.'],
 [["If it is cancer, has it spread?","If it is cancer, it has spread?","I didn't feel any swollen glands, which is reassuring. The lab result will tell us how deep it is, and that guides the next steps.","Yes, probably everywhere.",'Thông tin dựa trên khám, không phỏng đoán.'],
  ["How can I protect my skin?","How I can protect my skin?","Use sunscreen every day, wear a hat outside, and check your skin monthly for any changing moles.","You can't.",'Tư vấn phòng ngừa.']]);
E('Mr. Nhat, 23',["Football is my life. Am I finished?","Football is my life. I am finished?","Not at all. Many players return to football after ACL reconstruction and good rehab. It takes time, but it's very possible.","Probably yes.",'Hy vọng thực tế.'],
 [["How long until I can play football again?","How long until I can play football again?","After reconstruction, it's usually nine to twelve months of rehab before returning to matches.","Two weeks.",'Thời gian phục hồi cụ thể.'],
  ["Do I need surgery straight away?","I need surgery straight away?","No. We usually wait until the swelling goes down and your knee bends fully, often a few weeks.","Tonight.",'Giải thích thời điểm mổ.']]);
E('Ms. Hoa, 44',["I'm a music teacher. Will I lose my job?","I am music teacher. I will lose job?","I understand how important your hearing is for your work. Starting treatment quickly gives you the best chance of recovery.","Find a new job.",'Ghi nhận ảnh hưởng công việc.'],
 [["Will my hearing come back?","My hearing will come back?","About two out of three people recover some or all of their hearing, especially with early steroids.","No.",'Tiên lượng chính xác.'],
  ["Why do I need an MRI?","Why I need MRI?","To check there's nothing pressing on the hearing nerve. It's usually normal, but it's important to make sure.","For fun.",'Giải thích chỉ định.']]);
E('Ms. Thanh, 30',["I'm worried this will damage my kidneys.","I worry this damage my kidneys.","With the right antibiotics, it almost always clears up completely without lasting damage.","It might.",'Trấn an dựa trên bằng chứng.'],
 [["Why did you check whether I'm pregnant?","Why you check I am pregnant?","Some antibiotics aren't safe in pregnancy, and a kidney infection in pregnancy needs hospital treatment.","No reason.",'Giải thích lý do thử thai.'],
  ["How can I stop getting urine infections?","How I can stop get urine infection?","Drink plenty of water, don't hold your urine for long, and pass urine after sex.","Drink less.",'Tư vấn phòng tái phát.']]);
E('Ms. Linh, 33',["Did I cause this by eating too much fruit?","I cause this by eat too much fruit?","No, it's not your fault. Pregnancy hormones make it harder for your body to use insulin. Diet just helps us control it.","Yes, you did.",'Giảm cảm giác tội lỗi.'],
 [["Will I still have diabetes after the baby is born?","I still have diabetes after baby born?","It usually goes away after birth, but you'll have a sugar test six weeks later, and your future risk of type 2 diabetes is higher.","Yes, forever.",'Thông tin sau sinh.'],
  ["Will my baby have diabetes?","My baby will have diabetes?","No, but the baby may grow larger, and may have low sugar after birth. We'll check that carefully.","Yes.",'Giải đáp nguy cơ cho con.']]);
E('Mr. Hien, 68',["I'm worried I'll end up unable to look after myself.","I worry I end up cannot look after myself.","That's an understandable fear. Parkinson's usually progresses slowly, and medicines and exercise can keep you independent for many years.","You will.",'Thông tin tiên lượng cân bằng.'],
 [["Will the tablets stop the disease getting worse?","Tablet will stop disease get worse?","They don't stop it, but they improve the symptoms a lot. Regular exercise may also slow things down.","Yes, completely.",'Trung thực về hiệu quả thuốc.'],
  ["What exercise is good for me?","What exercise good for me?","Walking, tai chi, cycling and dancing are all great. Aim for thirty minutes most days.","Rest only.",'Tư vấn vận động.']]);
E('Mr. Tung, 28',["Did I give this to my girlfriend?","I give this to my girlfriend?","It spreads through food and water contaminated with stool. She should get vaccinated now, and you should wash your hands carefully.","Definitely.",'Tư vấn phòng lây cho người thân.'],
 [["How long until I can go back to work?","How long until I can back to work?","Most people feel better in two to six weeks. Stay off work for a week after the yellowing starts, and longer if you handle food.","Tomorrow.",'Hướng dẫn nghỉ làm.'],
  ["Can I drink beer when I feel better?","I can drink beer when feel better?","Please avoid alcohol until your liver tests are back to normal, usually a few months.","Of course.",'Dặn kiêng rượu.']]);
E('Mr. Lam, 40',["Will my children catch it?","My children will catch it?","They could, so we'll test everyone at home. Children who've been exposed can take medicine to prevent TB.","Probably.",'Truy vết và dự phòng.'],
 [["Can I still go to work?","I can still go to work?","Please stay home for the first two weeks of treatment. After that, you're very unlikely to spread it.","Yes, tomorrow.",'Hướng dẫn cách ly.'],
  ["What if I miss a dose?","What if I miss dose?","Take it as soon as you remember, unless it's almost time for the next one. Missing doses can make the TB resistant.","No problem.",'Nhấn mạnh tuân thủ.']]);
E('Ms. Ly, 19',["I'm scared of needles. Do I really need injections every day?","I scared needle. I really need injection every day?","I understand. The needles are tiny, and our diabetes nurse will teach you. Many young people manage it really well.","Yes. Get used to it.",'Đồng cảm với người trẻ mới chẩn đoán.'],
 [["Will I need insulin for the rest of my life?","I need insulin all my life?","Yes. With type 1 diabetes, your body doesn't make insulin anymore. But you can still live a full, active life.","No.",'Thông tin chính xác.'],
  ["Can I still go out with my friends?","I can still go out with friends?","Of course. We'll teach you how to adjust your insulin for food, exercise and parties.","No more parties.",'Hỗ trợ sống bình thường.']]);
E('Mr. Ba, 70',["I'm worried about having surgery at my age.","I worry about surgery at my age.","That's understandable. The risks of not operating are much higher, because the bowel could die. The anaesthetist will check you carefully.","You're too old.",'Cân bằng nguy cơ – lợi ích.'],

  ["How long until I can lift things again?","How long until I can lift things again?","Avoid heavy lifting for about six weeks to let the repair heal.","Tomorrow.",'Dặn dò sau mổ.']]);
