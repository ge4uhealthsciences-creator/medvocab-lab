   ["Hi, a patient has a fever. Can you come?",1,'Thiếu thông tin SBAR: ai, bối cảnh, đánh giá, đề nghị.',"(Doctor) Which patient? Which bed? What are his vital signs?"],
   ["Doctor, Mr. Tran is not good.",0,'Quá mơ hồ.',"(Doctor) What do you mean? I need details."]]}],
 end:'✅ Bạn đã cho thuốc an toàn, đánh giá đau và báo cáo SBAR rõ ràng.'},

{prof:'mid',cc:'Sản phụ con so chuyển dạ, nước ối xanh',who:'Ms. Mai, 26 — thai 39 tuần',pic:'🤰',
 v:[['contractions','cơn co'],['waters have broken','vỡ ối'],["baby's heartbeat",'tim thai'],['epidural','gây tê ngoài màng cứng'],['push','rặn']],
 st:[{n:"I think my waters have broken, and the contractions are getting stronger!",q:'Câu hỏi đầu tiên:',o:[
   ["You're doing really well. How often are the contractions coming, and how long do they last?",2,'',"Every four minutes. They last about a minute.",'Cơn co 4 phút/lần, mỗi cơn ~60 giây.'],
   ["Calm down, please.",0,'Thiếu hỗ trợ; nên hỏi về cơn co.',"I can't calm down! It hurts!"],
   ["Is this your first baby?",1,'Hữu ích, nhưng nên hỏi cơn co trước.',"Yes, it's my first."]]},
  {q:'Bước khám tiếp theo:',o:[
   ["I'm going to listen to your baby's heartbeat now. Is that okay?",2,'',"Yes. Is the baby okay?",'Tim thai 140 lần/phút, đều.'],
   ["(Thăm khám trong mà không giải thích)",0,'Luôn giải thích và xin đồng ý trước khi thăm khám.',"Wait! What are you doing?!"],
   ["Let's fill in the paperwork first.",0,'Ưu tiên đánh giá mẹ và thai.',"Now? I'm in pain!"]]},
  {n:"What colour should the water be? Mine looks a bit green.",q:'Nước ối xanh — bạn nói gì?',o:[
   ["Thank you for noticing. Green water can mean the baby has passed meconium, so I'll keep the baby's heartbeat on a monitor and let the doctor know.",2,'',"Okay. Please stay with me.",'Gắn monitor tim thai liên tục, báo bác sĩ sản.'],
   ["That's completely normal.",0,'Ối xanh (phân su) cần theo dõi tim thai liên tục.',"Oh, okay..."],
   ["Your baby is in danger!",0,'Thông tin cần chính xác nhưng bình tĩnh, không gây hoảng loạn.',"Oh no! What's happening?!"]]},
  {n:"The pain is too much. Can I have something?",q:'Giảm đau:',o:[
   ["You have some choices: breathing techniques, gas and air, or an epidural. Would you like me to explain each one?",2,'',"Yes, please. I think I'd like the epidural.",'Báo bác sĩ gây mê đặt tê ngoài màng cứng.'],
   ["No. Natural birth is best.",0,'Tôn trọng lựa chọn giảm đau của sản phụ.',"But I can't bear it..."],
   ["Just push harder.",0,'Chưa đủ điều kiện rặn.',"Push? Now?"]]},
  {q:'Cổ tử cung mở hết, đầu đã lọt — hướng dẫn rặn:',o:[
   ["When you feel the next contraction, take a deep breath, tuck your chin in, and push down into your bottom.",2,'',"(rặn) ...I can feel the head!",'🎉 Em bé chào đời, khóc to, Apgar 9 điểm.'],
   ["Push now! Push, push, push!",1,'Nên hướng dẫn cụ thể theo cơn co.',"I'm trying!",'Em bé chào đời, Apgar 8 điểm.'],
   ["Stop pushing.",0,'Sai thời điểm.',"What? Why?"]]}],
 end:'✅ Bạn đã theo dõi chuyển dạ, xử trí ối xanh và đỡ đẻ an toàn.'},

{prof:'pharm',cc:'Khách mua ibuprofen cho bố đang dùng warfarin',who:'Ms. Hoa, 40 — mua thuốc cho bố',pic:'👩',
 v:[['interaction','tương tác thuốc'],['blood thinner','thuốc chống đông'],['bleeding','chảy máu'],['dose','liều'],['bruising','bầm tím']],
 st:[{n:"Hi. I'd like a box of ibuprofen for my father's back pain, please.",q:'Trước khi bán thuốc:',o:[
   ["Of course. Does your father take any other medicines regularly?",2,'',"Yes, warfarin for his heart, and a blood pressure tablet.",'⚠️ Warfarin + ibuprofen → tăng nguy cơ chảy máu.'],
   ["Sure, that's thirty thousand dong.",0,'Phải hỏi thuốc đang dùng trước khi bán.',"Great, thanks! (khách rời đi)",'❌ Ông cụ nhập viện vì xuất huyết tiêu hóa một tuần sau.','end'],
   ["How old is he?",1,'Hữu ích, nhưng quan trọng nhất là các thuốc đang dùng.',"He's seventy-two. He also takes warfarin.",'⚠️ Warfarin + ibuprofen → tăng nguy cơ chảy máu.']]},
  {q:'Bố khách đang dùng warfarin. Bạn tư vấn:',o:[
   ["Ibuprofen isn't safe with warfarin because it raises the risk of bleeding. Paracetamol is a safer choice for him.",2,'',"Oh, I didn't know that. Thank you!",'Đổi sang paracetamol.'],
   ["It's fine for a few days.",0,'NSAID + warfarin gây xuất huyết, kể cả dùng ngắn ngày.',"Okay, if you say so."],
   ["You must ask a doctor. I can't help you.",1,'Dược sĩ có thể tư vấn lựa chọn an toàn hơn.',"But the clinic is closed today..."]]},
  {n:"How much paracetamol can he take?",q:'Hướng dẫn liều:',o:[
   ["One gram up to four times a day, at least four hours apart, and no more than four grams in twenty-four hours. Please check his other medicines don't also contain paracetamol.",2,'',"Got it. Four hours apart, four grams maximum."],
   ["As much as he needs.",0,'Quá liều paracetamol gây tổn thương gan.',"Really? There's no limit?"],
   ["Two tablets.",1,'Thiếu khoảng cách liều và liều tối đa.',"Two tablets... how often?"]]},
  {q:'Dặn dò thêm:',o:[
   ["If he notices black stools, blood in his urine, or unusual bruising, he should see a doctor straight away.",2,'',"I'll tell him. Thank you so much!"],
   ["Goodbye.",0,'Bỏ lỡ cơ hội dặn dấu hiệu chảy máu.',"Bye."],
   ["He should stop his warfarin while his back hurts.",0,'Không được tự ý ngừng warfarin.',"Is that safe?"]]}],
 end:'✅ Bạn đã phát hiện tương tác thuốc và tư vấn an toàn.'},

{prof:'diet',cc:'Tư vấn ăn uống cho người mới mắc đái tháo đường',who:'Ms. Lien, 50',pic:'👩',
 v:[['plate method','phương pháp chia đĩa'],['unsweetened','không đường'],['portion','khẩu phần'],['snack','bữa phụ'],['goal','mục tiêu']],
 st:[{n:"The doctor says I have diabetes. Do I have to stop eating rice?",q:'Bạn trả lời:',o:[
   ["Not completely. First, let's look at what you usually eat in a day.",2,'',"Breakfast is noodles, lunch is two big bowls of rice, and I drink three sweet milk teas a day.",'Ghi nhận khẩu phần 24 giờ.'],
   ["Yes. No more rice.",0,'Cấm tuyệt đối khó duy trì và không cần thiết.',"But I've eaten rice my whole life..."],
   ["Just eat less.",1,'Mơ hồ — cần đánh giá khẩu phần trước.',"Less... how much less?"]]},
  {q:'Về đồ uống:',o:[
   ["The sweet milk tea is a big source of sugar. Could you switch to unsweetened tea, or have just one small cup a week?",2,'',"One small cup a week... I can try that.",'Giảm khoảng 60 g đường mỗi ngày.'],
   ["Milk tea is fine.",0,'Đồ uống có đường làm đường huyết tăng mạnh.',"Great!"],
   ["Drink fruit juice instead.",0,'Nước ép cũng rất nhiều đường.',"Is juice better?"]]},
  {q:'Hướng dẫn bữa chính:',o:[
   ["Try the plate method: half the plate vegetables, a quarter protein like fish or tofu, and a quarter rice, which is about one small bowl.",2,'',"That sounds easy to remember."],
   ["Count every calorie.",1,'Có thể, nhưng khó với người mới bắt đầu.',"That sounds hard..."],
   ["Eat only vegetables.",0,'Thiếu đạm và năng lượng; không bền vững.',"I'll be hungry all day!"]]},
  {n:"I'm often hungry in the afternoon.",q:'Bạn khuyên:',o:[
   ["A small snack like a handful of nuts or a piece of fruit is fine. Shall we set one small goal for next week?",2,'',"Okay. My goal is no milk tea on weekdays!",'🎯 Đặt mục tiêu nhỏ, cụ thể.'],
   ["Just ignore the hunger.",0,'Nhịn đói dễ dẫn tới ăn bù quá mức.',"Okay..."],
   ["Have some cake for energy.",0,'Bánh ngọt làm tăng đường huyết.',"Yay, cake!"]]}],
 end:'✅ Bạn đã tư vấn dinh dưỡng thực tế, tôn trọng thói quen và đặt mục tiêu khả thi.'},

{prof:'epi',cc:'Điều tra ổ dịch ngộ độc thực phẩm sau đám cưới',who:'Mr. Bao, 33 — khách dự tiệc',pic:'🧔',
 v:[['outbreak','ổ dịch'],['symptoms','triệu chứng'],['attack rate','tỷ lệ tấn công'],['relative risk','nguy cơ tương đối'],['sample','mẫu']],
 st:[{n:"I got sick after my cousin's wedding on Saturday. So did lots of other guests.",q:'Mở đầu phỏng vấn:',o:[
   ["I'm sorry you've been unwell. I'm from the infection control team. Could I ask you some questions to help find the cause?",2,'',"Sure, go ahead."],
   ["Who cooked the food?",1,'Nên giới thiệu bản thân và xin phép trước.',"I don't know. Why?"],
   ["You should be more careful about what you eat.",0,'Đổ lỗi khiến người được phỏng vấn ngại hợp tác.',"Excuse me?"]]},
  {q:'Hỏi về thời gian:',o:[
   ["What time did you eat, and when did your symptoms start?",2,'',"We ate at seven in the evening. I started vomiting at around ten.",'Thời gian ủ bệnh ~3 giờ → gợi ý độc tố vi khuẩn.'],
   ["Were you sick?",0,'Câu hỏi đóng, không có mốc thời gian.',"Yes."],
   ["What were your symptoms?",1,'Đúng, nhưng thiếu mốc thời gian.',"Vomiting and stomach cramps."]]},
  {q:'Hỏi về món ăn:',o:[
   ["Which dishes did you eat? Please tell me everything, including drinks and desserts.",2,'',"Fried rice, chicken salad, spring rolls, and some cream cake.",'Ghi nhận đủ các món.'],
   ["Did you eat the chicken?",1,'Câu hỏi dẫn dắt gây sai lệch nhớ lại.',"Um... maybe? Yes, I think so."],
   ["Was the food bad?",0,'Mơ hồ và chủ quan.',"It tasted fine."]]},
  {q:'Tỷ lệ tấn công: cơm chiên 78% (người ăn) so với 12% (không ăn); gỏi gà 40% so với 38%. Kết luận?',o:[
   ["The fried rice is the most likely source, because people who ate it got sick far more often.",2,'',"(Trưởng nhóm) Agreed. The relative risk is about six point five.",'📊 RR ≈ 6,5 → cơm chiên.'],
   ["The chicken salad is the cause.",0,'Tỷ lệ ở hai nhóm gần như nhau.',"(Trưởng nhóm) Look at the attack rates again."],
   ["We can't say anything yet.",0,'Dữ liệu đã cho thấy liên quan rất mạnh.',"(Trưởng nhóm) The data is quite clear."]]},
  {q:'Khuyến nghị:',o:[
   ["We should take samples from the kitchen, check how the rice was stored, and teach the caterer to cool cooked rice quickly.",2,'',"(Trưởng nhóm) Good plan. Bacillus cereus loves rice left at room temperature."],
   ["Close every restaurant in the city.",0,'Biện pháp không tương xứng.',"(Trưởng nhóm) That's far too much."],
   ["Do nothing. It's over now.",0,'Cần ngăn ngừa tái diễn.',"(Trưởng nhóm) It could happen again next weekend."]]}],
 end:'✅ Bạn đã phỏng vấn đúng kỹ thuật, phân tích tỷ lệ tấn công và đưa khuyến nghị phù hợp.'},

{prof:'sw',cc:'Người bệnh sau đột quỵ sống một mình, lo viện phí',who:'Mr. Tu, 78',pic:'👴',
 v:[['support fund','quỹ hỗ trợ'],['health insurance','bảo hiểm y tế'],['discharge','ra viện'],['community nurse','điều dưỡng cộng đồng'],['walking frame','khung tập đi']],
 st:[{n:"The doctor says I can go home soon, but I live alone and I can't pay the hospital bill.",q:'Bạn đáp lại:',o:[
   ["Thank you for telling me. Let's take it one step at a time. Can you tell me about your situation at home?",2,'',"My wife passed away. My son works in another city. I live on the third floor, with no lift.",'Sống một mình, tầng 3, không thang máy.'],
   ["That's not my problem.",0,'Thiếu đồng cảm.',"(im lặng, cúi đầu)"],
   ["Everyone has money problems.",0,'Phủ nhận cảm xúc của người bệnh.',"I see..."]]},
  {q:'Về chi phí:',o:[
   ["Let me check your health insurance, and whether you qualify for the hospital's support fund.",2,'',"There's a fund? I didn't know that.",'BHYT chi trả 80% + quỹ hỗ trợ người bệnh.'],
   ["You must pay before you leave.",0,'Chưa tìm giải pháp hỗ trợ.',"But I can't..."],
   ["Ask your son for the money.",1,'Có thể, nhưng hãy tìm thêm nguồn hỗ trợ.',"He doesn't have much money either."]]},
  {q:'Liên hệ gia đình:',o:[
   ["Would it be all right if I called your son, so we can plan your care together?",2,'',"Yes, please. Here's his number.",'Đã xin đồng ý trước khi liên hệ gia đình.'],
   ["I'll call your son now.",1,'Cần xin phép người bệnh trước.',"Oh... okay."],
   ["You'll be fine on your own.",0,'Nguy cơ té ngã sau đột quỵ.',"I'm scared of falling on the stairs."]]},
  {q:'Kế hoạch ra viện:',o:[
   ["I'll arrange home visits from a community nurse and a physiotherapist, and a walking frame before you leave.",2,'',"Thank you. I feel much less alone now.",'📋 Kế hoạch ra viện an toàn.'],
   ["Stay in hospital until you're completely better.",0,'Không thực tế, tăng chi phí.',"How long would that be?"],
   ["Good luck.",0,'Bỏ rơi người bệnh.',"..."]]}],
 end:'✅ Bạn đã lắng nghe, tìm nguồn hỗ trợ tài chính và lập kế hoạch ra viện an toàn.'}
];

// ===================== ĐỢT 2: thêm 1 kịch bản cho mỗi nghề =====================
RCASES.push(
{prof:'nurse',cc:'Hướng dẫn tự tiêm insulin trước khi ra viện',who:'Mrs. Lien, 50',pic:'👩',
 v:[['insulin pen','bút tiêm insulin'],['inject','tiêm'],['low blood sugar','hạ đường huyết'],['rotate','luân phiên'],['show me','làm thử cho tôi xem']],
 st:[{n:"I'm scared of needles. Do I really have to inject myself?",q:'Bạn đáp:',o:[
   ["It's completely normal to feel nervous. The needle is very small, and I'll be right here while you practise.",2,'',"Okay... if you stay with me, I'll try."],
   ["Yes. Everyone has to.",0,'Thiếu đồng cảm, làm người bệnh lo hơn.',"(lo lắng hơn) I don't think I can do this."],
   ["Your husband can do it for you.",1,'Có thể hỗ trợ, nhưng nên giúp người bệnh tự chủ trước.',"He works away all week..."]]},
  {q:'Hướng dẫn kỹ thuật tiêm:',o:[
   ["First, wash your hands. Dial two units and do a safety shot. Then pinch the skin on your tummy, put the needle straight in, press the button, and count to ten.",2,'',"Two units first... pinch... count to ten. Got it.",'Thực hiện đúng kỹ thuật tiêm dưới da.'],
   ["Just inject it anywhere.",0,'Thiếu hướng dẫn kỹ thuật.',"Anywhere? Even into my arm muscle?"],
   ["Read the leaflet in the box.",1,'Nên hướng dẫn trực tiếp và cho thực hành.',"The writing is so small..."]]},
  {n:"Can I use the same spot every time?",q:'Bạn trả lời:',o:[
   ["It's better to rotate. Use a different spot on your tummy each time, at least a finger's width from the last one, so lumps don't form.",2,'',"Okay. I'll move around like a clock."],
   ["Yes, that's easier.",0,'Tiêm một chỗ gây loạn dưỡng mỡ, insulin hấp thu kém.',"Great, easier for me."],
   ["Only inject into your arm.",0,'Vị trí ưu tiên là bụng, và phải luân phiên.',"Only my arm?"]]},
  {q:'Dạy cách xử trí hạ đường huyết:',o:[
   ["If you feel shaky, sweaty or confused, check your sugar. If it's below four, have three sweets or half a glass of juice, then check again in fifteen minutes.",2,'',"Shaky or sweaty... below four... sweets, then check again.",'Nắm được quy tắc 15–15.'],
   ["Low sugar is rare. Don't worry about it.",0,'Hạ đường huyết là biến chứng thường gặp, phải dạy cách xử trí.',"Okay, I won't worry."],
   ["If you feel shaky, inject more insulin.",0,'NGUY HIỂM: làm hạ đường huyết nặng hơn!',"More insulin? Okay...",'Hướng dẫn sai có thể gây hôn mê hạ đường huyết.','end']]},
  {q:'Kiểm tra lại người bệnh đã hiểu:',o:[
   ["Could you show me how you'd give tomorrow morning's dose, and tell me what you'd do if you felt shaky?",2,'',"(tự tiêm đúng) And if I'm shaky, I check my sugar and eat sweets!",'✅ Teach-back thành công.'],
   ["Do you understand? Yes? Good.",0,'Hỏi "hiểu chưa" không kiểm tra được gì.',"Yes... I think so."],
   ["Here's a video link to watch at home.",1,'Hữu ích, nhưng cần cho thực hành tại chỗ.',"I'll watch it later."]]}],
 end:'✅ Người bệnh tự tin tự tiêm insulin và biết xử trí hạ đường huyết.'},

{prof:'mid',cc:'Mẹ sau sinh 2 giờ: hỗ trợ bú mẹ & phát hiện băng huyết',who:'Ms. Mai, 26 — sau sinh 2 giờ',pic:'🤱',
 v:[['latch','ngậm bắt vú'],['colostrum','sữa non'],['skin-to-skin','da kề da'],['womb','tử cung'],['heavy bleeding','chảy máu nhiều']],
 st:[{n:"The baby keeps crying and won't feed. Maybe I don't have any milk.",q:'Bạn trấn an:',o:[
   ["You do have milk. It's called colostrum, and it comes in small amounts at first. Let's try skin-to-skin and work on the latch together.",2,'',"Really? Okay, let's try.",'Đặt bé da kề da, bé bình tĩnh hơn.'],
   ["Give the baby formula, then.",0,'Chưa hỗ trợ bú mẹ đã chuyển sang sữa công thức.',"Oh... but I wanted to breastfeed."],
   ["Babies always cry.",0,'Bỏ qua lo lắng của mẹ.',"But he's so hungry..."]]},
  {q:'Hướng dẫn ngậm bắt vú:',o:[
   ["Hold him tummy to tummy, nose to nipple. Wait for a wide-open mouth, then bring him to the breast so he takes a big mouthful.",2,'',"Oh! He's sucking now, and it doesn't hurt.",'✅ Ngậm bắt vú đúng, nghe tiếng nuốt.'],
   ["Just push the nipple into his mouth.",0,'Ngậm nông gây đau, nứt núm vú.',"Ouch! That really hurts."],
   ["Feed him lying flat on his back.",0,'Tư thế sai, bé khó ngậm.',"He keeps turning his head away."]]},
  {n:"I feel dizzy, and the pad is soaked again. Is that normal?",q:'Bạn làm gì?',o:[
   ["Let me check you right now. I'm going to feel your womb and check your blood pressure.",2,'',"Okay... I feel cold.",'Tử cung mềm nhão, máu chảy nhiều (~700 ml), mạch 118, HA 90/55.'],
   ["That's normal after giving birth.",0,'Chóng mặt + thấm ướt băng nhanh là dấu hiệu băng huyết!',"Okay...",'30 phút sau sản phụ ngất vì mất máu.','end'],
   ["Change the pad and have a rest.",0,'Phải đánh giá ngay lượng máu mất và co hồi tử cung.',"Okay, I'll lie down."]]},
  {q:'Tử cung mềm nhão, máu chảy nhiều — xử trí:',o:[
   ["I'm pressing the alarm for help. I'll rub your womb to help it tighten, and we'll give you medicine to stop the bleeding.",2,'',"(Đội cấp cứu đến) The bleeding is slowing down.",'✅ Xoa đáy tử cung + oxytocin → tử cung co tốt, máu cầm.'],
   ["I'll call the doctor after I finish my paperwork.",0,'Băng huyết là cấp cứu — gọi trợ giúp ngay.',"(sản phụ lả đi)"],
   ["Drink some water.",0,'Không xử trí nguyên nhân.',"I can't... I'm so tired."]]},
  {n:"Is my baby okay? Can I still feed him?",q:'Bạn trả lời:',o:[
   ["Your baby is fine. Once you're stable, you can hold him skin-to-skin again, and feeding will actually help your womb contract.",2,'',"Thank you. I was so frightened."],
   ["Not today. You're too weak.",1,'Có thể cho bú lại khi ổn định; bú mẹ giúp tử cung co hồi.',"Oh... I see."],
   ["Don't ask so many questions.",0,'Thiếu tôn trọng, thiếu trấn an.',"(khóc)"]]}],
 end:'✅ Bạn đã hỗ trợ bú mẹ đúng cách và phát hiện, xử trí kịp thời băng huyết sau sinh.'},

{prof:'pharm',cc:'Khách xin mua kháng sinh không đơn cho cảm lạnh',who:'Mr. Dung, 30',pic:'🧑',
 v:[['antibiotics','kháng sinh'],['prescription','đơn thuốc'],['virus','vi rút'],['resistance','kháng thuốc'],['saline spray','xịt nước muối']],
 st:[{n:"I've got a cold. Can I have some amoxicillin? It always helps.",q:'Bạn đáp:',o:[
   ["I'm sorry you're feeling unwell. Can you tell me your symptoms and how long you've had them?",2,'',"A runny nose, a sore throat and a cough for three days. No fever.",'Triệu chứng gợi ý nhiễm virus đường hô hấp trên.'],
   ["Sure. That's fifty thousand dong.",0,'Bán kháng sinh không đơn là sai quy định và gây kháng thuốc.',"Thanks! (khách rời đi)",'Bán kháng sinh không cần thiết, góp phần gây kháng thuốc.','end'],
   ["No. Go away.",0,'Từ chối thiếu chuyên nghiệp.',"How rude! I'll buy it somewhere else."]]},
  {q:'Giải thích cho khách:',o:[
   ["Colds are caused by viruses, and antibiotics don't kill viruses. Taking them when you don't need them can cause side effects and make bacteria resistant.",2,'',"Oh. I always thought they helped."],
   ["Antibiotics are only for serious people.",0,'Thông tin vô nghĩa.',"What does that mean?"],
   ["The law says no.",1,'Đúng, nhưng nên giải thích lý do khoa học.',"But why does it matter?"]]},
  {n:"So what can I take?",q:'Tư vấn điều trị:',o:[
   ["Paracetamol for the sore throat, honey and warm drinks for the cough, saline spray for your nose, and plenty of rest.",2,'',"That sounds sensible. I'll take those.",'Tư vấn điều trị triệu chứng phù hợp.'],
   ["Nothing. You'll just have to suffer.",0,'Nên tư vấn điều trị triệu chứng.',"Great..."],
   ["Take some of your friend's antibiotics.",0,'Nguy hiểm và sai nguyên tắc.',"Is that okay?"]]},
  {q:'Dặn khi nào cần đi khám:',o:[
   ["If you get a high fever, have trouble breathing, or you're not better after ten days, please see a doctor.",2,'',"Got it. Thank you for explaining."],
   ["Never see a doctor for a cold.",0,'Phải dặn dấu hiệu cảnh báo.',"Okay..."],
   ["Come back tomorrow and I'll sell you antibiotics.",0,'Mâu thuẫn và sai quy định.',"Hmm, okay!"]]}],
 end:'✅ Bạn đã từ chối khéo léo, giải thích về kháng kháng sinh và tư vấn điều trị phù hợp.'},

{prof:'diet',cc:'Tư vấn ăn dặm cho bé 6 tháng tuổi',who:'Ms. Thu — mẹ bé Bông',pic:'👩',
 v:[['solid food','thức ăn đặc / ăn dặm'],['iron-rich','giàu sắt'],['breast milk','sữa mẹ'],['choking','hóc sặc'],['allergic','dị ứng']],
 st:[{n:"My daughter is six months old. When should she start solid food?",q:'Bạn trả lời:',o:[
   ["Six months is the perfect time. Can she sit up with support, and does she show interest when you eat?",2,'',"Yes! She grabs at my spoon.",'Bé đã sẵn sàng ăn dặm.'],
   ["Wait until she's one.",0,'Ăn dặm muộn gây thiếu sắt, chậm kỹ năng ăn.',"Really? That long?"],
   ["She should have started at three months.",0,'Không ăn dặm trước 4–6 tháng.',"Oh no, am I late?"]]},
  {q:'Gợi ý những món đầu tiên:',o:[
   ["Start with smooth, iron-rich foods, like rice porridge mixed with mashed meat, egg yolk or tofu, and soft vegetables.",2,'',"Meat already? I'll try pork and pumpkin.",'Ưu tiên thực phẩm giàu sắt.'],
   ["Only fruit juice at first.",0,'Nước ép không cung cấp đủ năng lượng và sắt.',"Juice is easy!"],
   ["Add salt and fish sauce so she likes it.",0,'Không thêm muối, nước mắm cho trẻ dưới 1 tuổi.',"She'll like it better!"]]},
  {n:"My mother says to keep giving lots of breast milk. Is that right?",q:'Bạn đáp:',o:[
   ["Yes, your mother's right. Breast milk is still her main food until she's one, and we add solids little by little.",2,'',"Good! I'll tell her you agree."],
   ["No. Stop breastfeeding now.",0,'Khuyến khích tiếp tục bú mẹ tới 2 tuổi.',"Oh no..."],
   ["It doesn't really matter.",1,'Nên khẳng định vai trò của sữa mẹ.',"Hmm, okay."]]},
  {q:'An toàn khi cho bé ăn:',o:[
   ["Always sit with her while she eats, keep her upright, and avoid whole nuts, grapes or hard pieces that could make her choke.",2,'',"Got it. No whole grapes or nuts."],
   ["Let her eat alone while you cook.",0,'Nguy cơ hóc sặc.',"That saves time!"],
   ["Feed her while she's lying down.",0,'Tăng nguy cơ sặc.',"She likes lying down..."]]},
  {n:"What if she's allergic to something?",q:'Bạn dặn:',o:[
   ["Introduce one new food every two to three days. If you see a rash, swelling or vomiting, stop that food and see a doctor.",2,'',"One new food at a time. Thank you!"],
   ["Babies are never allergic.",0,'Sai — dị ứng thức ăn ở trẻ nhỏ khá thường gặp.',"Okay."],
   ["Give her everything at once.",0,'Khó xác định thực phẩm gây dị ứng.',"That's quicker!"]]}],
 end:'✅ Bạn đã tư vấn ăn dặm đúng thời điểm, đủ sắt, an toàn và duy trì bú mẹ.'},

{prof:'epi',cc:'Điều tra chùm ca sốt xuất huyết trong khu dân cư',who:'Ms. Hai, 45 — tổ trưởng dân phố',pic:'👩',
 v:[['dengue fever','sốt xuất huyết'],['mosquito','muỗi'],['standing water','nước đọng'],['larvae','bọ gậy'],['cluster','chùm ca bệnh']],
 st:[{n:"Five people on our street have had dengue this month. What should we do?",q:'Bạn hỏi:',o:[
   ["Thank you for reporting it. First, could you tell me where each person lives and when they got sick?",2,'',"They all live within a hundred metres, and they got sick over the last ten days.",'📍 Chùm 5 ca trong bán kính 100 m, 10 ngày.'],
   ["It's just bad luck.",0,'5 ca trong một khu là ổ dịch cần điều tra.',"Oh... okay."],
   ["Everyone should take antibiotics.",0,'Kháng sinh không điều trị sốt xuất huyết.',"Antibiotics? For dengue?"]]},
  {q:'Khảo sát môi trường:',o:[
   ["Let's walk around together and look for standing water in pots, old tyres and water tanks, where mosquitoes lay their eggs.",2,'',"There's a pile of old tyres behind the market.",'🦟 Bọ gậy trong lốp xe cũ và lu nước không đậy.'],
   ["We'll spray the whole city tomorrow.",1,'Phun hóa chất cần kết hợp diệt bọ gậy tại nguồn.',"The whole city?"],
   ["Mosquitoes aren't the problem.",0,'Muỗi Aedes là vật trung gian truyền bệnh.',"Really?"]]},
  {q:'Kết quả: 18/40 nhà có bọ gậy (chỉ số Breteau ≈ 45). Nhận định?',o:[
   ["That's a very high larval index, so there's a high risk of more cases. We need to act this week.",2,'',"(Trưởng nhóm) Agreed. A Breteau index above twenty is high risk."],
   ["That's normal.",0,'Chỉ số Breteau > 20 là nguy cơ cao.',"(Trưởng nhóm) Look at it again."],
   ["We can't tell anything from that.",0,'Chỉ số đã cho thấy nguy cơ cao.',"(Trưởng nhóm) The index is quite clear."]]},
  {q:'Thông điệp cho người dân:',o:[
   ["Please cover water containers, empty standing water every week, sleep under mosquito nets, and see a doctor early if you have a high fever.",2,'',"I'll share this in our street's group chat tonight.",'📢 Thông điệp phòng chống rõ ràng.'],
   ["Stay indoors forever.",0,'Không thực tế.',"Forever?"],
   ["Take aspirin if you get a fever.",0,'NGUY HIỂM: aspirin làm tăng nguy cơ xuất huyết trong sốt xuất huyết.',"Aspirin? Okay...",'Thông điệp sai có thể gây xuất huyết nặng.','end']]}],
 end:'✅ Bạn đã điều tra ổ dịch, đánh giá chỉ số côn trùng và truyền thông phòng chống đúng.'},

{prof:'sw',cc:'Nhiều vết bầm tái diễn — sàng lọc bạo lực gia đình',who:'Ms. Ngan, 32',pic:'👩',
 v:[['safe','an toàn'],['confidential','bảo mật'],['bruises','vết bầm'],['shelter','nhà tạm lánh'],['safety plan','kế hoạch an toàn']],
 st:[{n:"The nurse said you wanted to see me?",q:'Bạn gặp riêng người bệnh. Mở đầu:',o:[
   ["Yes. I'd like to talk with you privately. What you tell me stays confidential, unless someone is in immediate danger.",2,'',"Okay... thank you for closing the door."],
   ["Your husband is hitting you, isn't he?",0,'Câu hỏi dồn ép khiến người bệnh khép lòng.',"No! I fell. Can I go now?"],
   ["(Hỏi chuyện khi chồng đang ngồi cạnh)",0,'Luôn hỏi riêng, không có mặt người có thể gây hại.',"(Người chồng trả lời thay) She's clumsy. She falls a lot."]]},
  {n:"I've had a few falls lately.",q:'Bạn hỏi tiếp:',o:[
   ["Sometimes injuries like these happen when someone at home is hurting us. Is anyone hurting you, or making you feel unsafe?",2,'',"(im lặng một lúc) ...Yes. My husband, when he drinks.",'Người bệnh bắt đầu chia sẻ.'],
   ["You should be more careful.",0,'Bỏ lỡ cơ hội sàng lọc.',"Yes... I'll be careful."],
   ["Why don't you just leave him?",0,'Phán xét; rời đi là quyết định khó và có thể nguy hiểm.',"It's not that easy!"]]},
  {q:'Đáp lại lời chia sẻ:',o:[
   ["Thank you for trusting me. It's not your fault, and you don't deserve to be hurt.",2,'',"(khóc) I thought it was my fault."],
   ["Are you sure? He seemed nice.",0,'Nghi ngờ lời kể gây tổn thương thêm.',"...Forget it."],
   ["I'm calling the police right now.",1,'Tôn trọng quyết định của người bệnh, trừ khi có nguy hiểm tức thời.',"No, please! He'll be even angrier!"]]},
  {q:'Đánh giá an toàn:',o:[
   ["Do you feel safe going home tonight? If not, there's a shelter, and I can help you make a safety plan.",2,'',"Can I stay with my sister? He doesn't know where she lives.",'📋 Kế hoạch an toàn: tạm ở nhà chị gái.'],
   ["Go home and talk to him calmly.",0,'Có thể đẩy người bệnh vào nguy hiểm.',"Okay..."],
   ["There's nothing we can do.",0,'Có nhiều nguồn hỗ trợ.',"Oh."]]},
  {q:'Kết thúc buổi gặp:',o:[
   ["Here's a support hotline number. You can call any time, day or night, and you can come back to see me whenever you want.",2,'',"Thank you. I'll save it under a different name in my phone."],
   ["Here's a leaflet. Take it home with you.",1,'Tờ rơi mang về có thể bị phát hiện — hãy cân nhắc cách giữ an toàn.',"(lo lắng) What if he sees it?"],
   ["Good luck.",0,'Bỏ rơi người bệnh.',"..."]]}],
 end:'✅ Bạn đã sàng lọc tế nhị, tôn trọng quyết định của người bệnh và lập kế hoạch an toàn.'}
);

// ===================== ĐỢT 4: mỗi nghề thêm 1 kịch bản (3 kịch bản / nghề) =====================
RCASES.push(
{prof:'nurse',cc:'Ca đêm: cụ ông lú lẫn, đòi tự đi vệ sinh — nguy cơ té ngã',who:'Mr. Phat, 84 — nội trú đêm',pic:'👴',
 v:[['confused','lú lẫn'],['fall','té ngã'],['call bell','chuông gọi'],['bed rails','thanh chắn giường'],['delirium','mê sảng']],
 st:[{n:"Where am I? I need to go home! I need the toilet now!",q:'Cụ ông đang cố trèo qua thanh chắn giường. Bạn làm gì?',o:[
   ["Mr. Phat, I'm Lan, your nurse. You're in hospital, and you're safe. Let me help you to the toilet. Please wait for me.",2,'',"Hospital? Oh... okay. Help me, please.",'Cụ bình tĩnh hơn khi được định hướng.'],
   ["Stop it! Get back in bed!",0,'Quát mắng làm người lú lẫn kích động hơn.',"(càng hoảng loạn) Let me go!"],
   ["(Đi lấy dây trói tay)",0,'Không tự ý cố định người bệnh; ưu tiên biện pháp không dùng ràng buộc.',"(giằng co, suýt ngã)",'Cụ gần ngã khỏi giường.']]},
  {q:'Sau khi đưa cụ đi vệ sinh an toàn, bạn kiểm tra nguyên nhân lú lẫn:',o:[
   ["I'm going to check your temperature, blood pressure and sugar level, and see when you last passed urine.",2,'',"Okay, nurse.",'🔎 Sốt 38,2°C, nước tiểu đục, chưa đi tiểu từ chiều → nghi nhiễm trùng tiểu gây mê sảng.'],
   ["He's just old. It's normal.",0,'Lú lẫn cấp không phải do tuổi — phải tìm nguyên nhân.',"(lẩm bẩm)"],
   ["Give him a sleeping tablet.",0,'Thuốc ngủ làm mê sảng nặng hơn, tăng nguy cơ ngã.',"(ngủ gà, đứng dậy loạng choạng)"]]},
  {q:'Giảm nguy cơ té ngã:',o:[
   ["I'll lower the bed, put the call bell in your hand, leave a night light on, and check on you every hour.",2,'',"Thank you. I'll ring if I need you.",'✅ Các biện pháp phòng ngã cơ bản.'],
   ["Close the door so he can't get out.",0,'Không an toàn, không theo dõi được.',"(bối rối)"],
   ["Raise the bed as high as possible.",0,'Giường cao tăng chấn thương khi ngã.',"..."]]},
  {q:'Gọi điện báo con gái của cụ:',o:[
   ["Hello, this is Lan from Ward A. Your father is safe, but he became confused tonight, possibly from an infection. The doctor is checking him. Would you be able to visit tomorrow? Familiar faces really help.",2,'',"(Con gái) Thank you for calling. I'll come first thing in the morning."],
   ["Your father is crazy tonight.",0,'Từ ngữ thiếu tôn trọng, gây hoảng sợ.',"(Con gái) What?! What happened?"],
   ["Nothing to report.",0,'Gia đình cần được thông tin, hỗ trợ định hướng cho người bệnh.',"(Con gái) Okay, bye."]]}],
 end:'✅ Bạn đã xử trí mê sảng an toàn, tìm nguyên nhân, phòng ngã và thông tin cho gia đình.'},

{prof:'mid',cc:'Khám thai lần đầu: tư vấn dấu hiệu nguy hiểm & dinh dưỡng',who:'Ms. Huyen, 24 — thai 12 tuần',pic:'🤰',
 v:[['antenatal check-up','khám thai'],['folic acid','axit folic'],['danger signs','dấu hiệu nguy hiểm'],['tetanus vaccine','vắc xin uốn ván'],['bleeding','ra máu']],
 st:[{n:"This is my first pregnancy. I'm so excited, but I don't really know what to do.",q:'Mở đầu:',o:[
   ["Congratulations! We'll go through everything together today. First, how have you been feeling?",2,'',"A bit sick in the mornings, but otherwise good."],
   ["Just follow what your mother did.",0,'Bỏ lỡ cơ hội tư vấn.',"But she lives far away..."],
   ["Fill in this form first.",1,'Nên tạo không khí cởi mở trước.',"Okay..."]]},
  {q:'Về thuốc bổ:',o:[
   ["Please take a folic acid and iron tablet every day. They help prevent birth defects and anaemia.",2,'',"I'll start today.",'Bổ sung sắt – axit folic hằng ngày.'],
   ["You don't need any vitamins.",0,'Axit folic và sắt được khuyến cáo trong thai kỳ.',"Okay."],
   ["Take as many vitamins as you can.",0,'Một số vitamin liều cao (vitamin A) gây hại cho thai.',"All of them?"]]},
  {n:"What foods should I avoid?",q:'Bạn tư vấn:',o:[
   ["Avoid raw or undercooked meat, eggs and fish, and unpasteurised milk. Limit coffee to one cup a day, and no alcohol at all.",2,'',"No more raw oysters for me!"],
   ["Eat for two people.",0,'Không cần ăn gấp đôi; tăng cân quá mức có hại.',"Double portions? Great!"],
   ["Avoid all fruit.",0,'Trái cây tốt cho thai kỳ.',"But I love mango..."]]},
  {q:'Dặn dấu hiệu nguy hiểm:',o:[
   ["Come to hospital straight away if you have bleeding, severe stomach pain, a bad headache with blurred vision, or if the baby moves less later on.",2,'',"Bleeding, bad pain, headache, less movement. I'll remember.",'✅ Nắm được dấu hiệu nguy hiểm.'],
   ["Only come back if you're in labour.",0,'Phải biết các dấu hiệu cần khám ngay.',"Okay..."],
   ["Spotting is always normal.",0,'Ra máu khi mang thai cần được đánh giá.',"Good to know..."]]},
  {q:'Lịch tiêm & tái khám:',o:[
   ["You'll need a tetanus vaccine, and we'll see you every four weeks, with an ultrasound scan at twenty weeks.",2,'',"I'll put the dates in my phone."],
   ["Come back when the baby is born.",0,'Khám thai định kỳ là bắt buộc.',"Really?"],
   ["Vaccines are dangerous in pregnancy.",0,'Vắc xin uốn ván an toàn và cần thiết.',"Oh, I'll skip them then."]]}],
 end:'✅ Bạn đã tư vấn khám thai lần đầu đầy đủ: bổ sung vi chất, ăn uống, dấu hiệu nguy hiểm và lịch tái khám.'},

{prof:'pharm',cc:'Phụ nữ mang thai 30 tuần mua thuốc đau đầu',who:'Ms. Trinh, 29 — thai 30 tuần',pic:'🤰',
 v:[['headache','đau đầu'],['pregnant','mang thai'],['ibuprofen','ibuprofen'],['paracetamol','paracetamol'],['blood pressure','huyết áp']],
 st:[{n:"Hi, I've had a headache all day. Can I have some ibuprofen, please?",q:'Bạn nhận thấy khách đang mang thai. Bạn hỏi:',o:[
   ["Of course I'll help. Are you pregnant, and if so, how many weeks?",2,'',"Yes, thirty weeks.",'⚠️ Ibuprofen chống chỉ định từ tuần 28–30 của thai kỳ.'],
   ["Sure, here you go.",0,'Phải hỏi tình trạng thai trước khi bán thuốc.',"Thanks!",'Bán NSAID cho thai 30 tuần có thể gây đóng sớm ống động mạch của thai.','end'],
   ["Pregnant women can't take anything.",1,'Vẫn có lựa chọn an toàn hơn.',"So I just suffer?"]]},
  {q:'Hỏi thêm về cơn đau đầu:',o:[
   ["Is it a severe headache, and do you have blurred vision, swelling in your face or hands, or pain under your ribs?",2,'',"No, it's mild. I just didn't sleep well.",'Không có dấu hiệu tiền sản giật.'],
   ["Headaches are normal in pregnancy.",0,'Phải loại trừ dấu hiệu tiền sản giật.',"Okay..."],
   ["Have you eaten today?",1,'Hữu ích nhưng cần hỏi dấu hiệu nguy hiểm trước.',"Yes, I had lunch."]]},
  {q:'Tư vấn thuốc:',o:[
   ["Ibuprofen isn't safe at this stage of pregnancy. Paracetamol is safer. Take one gram, no more than four times a day.",2,'',"Paracetamol, then. Thank you for checking.",'Đổi sang paracetamol.'],
   ["Take aspirin instead.",0,'Không tự ý dùng aspirin liều giảm đau khi mang thai.',"Is aspirin okay?"],
   ["Take ibuprofen, but only half a tablet.",0,'Ibuprofen chống chỉ định ở 3 tháng cuối dù liều thấp.',"Half is fine?"]]},
  {q:'Dặn dò:',o:[
   ["If the headache gets worse, or you get blurred vision or swelling, go to the hospital straight away and get your blood pressure checked.",2,'',"I will. Thank you so much."],
   ["Come back if you need more pills.",0,'Thiếu dặn dò dấu hiệu nguy hiểm.',"Okay."],
   ["Don't tell your doctor.",0,'Sai — cần báo bác sĩ khám thai.',"Why not?"]]}],
 end:'✅ Bạn đã phát hiện chống chỉ định thuốc trong thai kỳ và sàng lọc dấu hiệu tiền sản giật.'},

{prof:'diet',cc:'Tư vấn giảm cân cho người tăng huyết áp (phỏng vấn tạo động lực)',who:'Mr. Quang, 46',pic:'🧔',
 v:[['lose weight','giảm cân'],['ready','sẵn sàng'],['small changes','thay đổi nhỏ'],['portion','khẩu phần'],['support','hỗ trợ']],
 st:[{n:"The doctor sent me. I know I need to lose weight, but I've tried everything and nothing works.",q:'Bạn đáp:',o:[
   ["It sounds really frustrating to try so hard. What have you tried, and what made it difficult?",2,'',"Strict diets. I last a week, then I'm starving and give up.",'Lắng nghe phản hồi — người bệnh mở lòng.'],
   ["You just need more willpower.",0,'Đổ lỗi làm giảm động lực.',"(khoanh tay) Thanks a lot."],
   ["Here's a 1,200-calorie diet plan.",1,'Chưa tìm hiểu người bệnh đã đưa kế hoạch.',"Another strict diet? I'll never stick to it."]]},
  {q:'Khơi gợi động lực:',o:[
   ["On a scale of one to ten, how important is losing weight to you right now, and why?",2,'',"About eight. I want to see my daughter graduate from university.",'Động lực nội tại: vì con gái.'],
   ["You'll die early if you don't.",0,'Dọa nạt gây phản kháng.',"Everyone dies anyway."],
   ["Your BMI is thirty-one.",1,'Số liệu đúng nhưng chưa khơi gợi động lực.',"I know..."]]},
  {n:"But I eat out with clients almost every day.",q:'Cùng tìm giải pháp:',o:[
   ["That's a real challenge. What's one small change you think you could make at those meals?",2,'',"Maybe I could skip the second bowl of rice, and drink tea instead of beer.",'Người bệnh tự đề xuất thay đổi.'],
   ["Stop going to client dinners.",0,'Không thực tế với công việc.',"I'd lose my job!"],
   ["Just order salad every time.",1,'Áp đặt; nên để người bệnh tự đề xuất.',"Salad at a business dinner? Hmm."]]},
  {q:'Chốt mục tiêu:',o:[
   ["That's a great plan. Shall we write it down: one bowl of rice and tea instead of beer, five days a week? I'll see you again in four weeks.",2,'',"Yes. That feels doable.",'🎯 Mục tiêu SMART, theo dõi sau 4 tuần.'],

const scrollDlg=()=>{$('dlg').scrollTop=1e5};
// ---- Luyện nói / nhại giọng (Web Speech API, chạy tốt nhất trên Chrome) ----
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let voiceOn=!!SR;const VS={n:0,s:0};
const VN=/[ăâđêôơưàáảãạằắẳẵặầấẩẫậèéẻẽẹềếểễệìíỉĩịòóỏõọồốổỗộờớởỡợùúủũụừứửữựỳýỷỹỵ]/i,isEn=t=>!VN.test(t)&&/\b(the|you|your|i|i'm|is|are|a|an|to|and|it|it's|my|of|do|in|can|what|please|we|this|that|for|have|be|will|how|yes|no)\b/i.test(t);
const clean=t=>t.replace(/^[^A-Za-z(]+/,'').replace(/^\([^)]*\)\s*/,'');

  try{const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;let got=0;speechSynthesis.cancel();
    r.onresult=e=>{got=1;cb([...e.results[0]].map(a=>a.transcript))};r.onerror=e=>toast('🎤 '+micErr(e.error));r.onend=()=>{if(!got&&fail)fail()};r.start()}catch(e){toast('Could not turn on the microphone');fail&&fail()}}
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const micErr=c=>c=='not-allowed'||c=='service-not-allowed'?(inFrame?'The microphone is blocked because the game is embedded. Open the game in its own Chrome tab.':'Microphone permission is off. Tap the 🔒 icon in the address bar → Allow microphone.'):c=='network'?'Chrome speech recognition needs an Internet connection.':c=='no-speech'?'I heard nothing. Speak louder and closer to the microphone.':c=='audio-capture'?'No microphone found on this device.':'Not clear, please try again ('+c+').';
function scoreVoice(m,a){VS.n++;VS.s+=m.r;const d=document.createElement('div');d.className='note find';d.innerHTML='🎤 You said: "'+esc(a)+'"<br>Match '+Math.round(m.r*100)+'% '+(m.r>=.9?'🌟 Excellent!':m.r>=.7?'👍 Good':'— practise the underlined words')+'<br><span style="font-size:13px">'+m.html+'</span>';$('chat').appendChild(d);scrollDlg();hud()}
// Nhại giọng: bấm 🎤 dưới câu của nhân vật để nói lại theo

// Repeat mode: before a chosen English line is "said", the player hears it and repeats it aloud.

  const rb=w.querySelector('.rb'),mk=(txt,cls,f)=>{const b=document.createElement('button');b.className='opt '+(cls||'');b.textContent=txt;b.onclick=f;rb.appendChild(b);return b};

// Hiện các lựa chọn (đánh số để khán giả live bình chọn). s = điểm (2 tốt), dùng cho gợi ý 💡
function ask(items,cb){$('opts').innerHTML='';clearTimeout(voteTimer);votes={};
  if(easyOn&&!live){const sc0=items.filter(i=>i.s!=null);if(sc0.length>2&&sc0.length==items.length){const top=Math.max(...sc0.map(i=>i.s)),good=items.filter(i=>i.s===top),bad=items.filter(i=>i.s!==top);
    if(good.length&&bad.length){const keep=new Set([good[0],bad[Math.floor(Math.random()*bad.length)]]);items=items.filter(i=>keep.has(i))}}}
  const cb0=cb;cb=(it,j)=>{if(repeatOn&&!live&&isEn(it.t)&&it.s!==0)practiceThen(it.t,()=>cb0(it,j));else cb0(it,j)};
  const sc=items.map(i=>i.s).filter(s=>s!=null),best=sc.length?Math.max(...sc):-1,useH=hints>0&&best>0,bs=[];
  items.forEach((it,j)=>{const b=document.createElement('button');b.className='opt'+(it.cls?' '+it.cls:'');b.dataset.l=(j+1)+'. '+(useH&&it.s===best?'✅ ':'')+it.t;
    b.innerHTML='<span class="lb"></span>';b.firstChild.textContent=b.dataset.l;
    if(isEn(it.t)){const sp=document.createElement('span');sp.className='spk';sp.textContent='🔊';sp.onclick=e=>{e.stopPropagation();say(clean(it.t))};b.appendChild(sp)}
    b.onclick=()=>{clearTimeout(voteTimer);vote=null;$('opts').innerHTML='';cb(it,j)};$('opts').appendChild(b);bs.push(b)});
  // Nói để chọn: nhận giọng → chọn câu khớp nhất + chấm phát âm
  if(voiceOn&&SR&&items.filter(i=>isEn(i.t)).length>1){const mb=document.createElement('button');mb.className='opt mic';const L='🎤 Say your chosen sentence in English';mb.textContent=L;
    mb.onclick=()=>{mb.textContent='🔴 Listening… speak now';listen(alts=>{let bst=null;items.forEach((it,j)=>{if(!isEn(it.t))return;alts.forEach(a=>{const m=match(clean(it.t),a);if(!bst||m.r>bst.m.r)bst={j,m,a}})});
      if(!bst||bst.m.r<.4){mb.textContent='🤔 No option matched ("'+alts[0]+'") — tap to try again';return}scoreVoice(bst.m,bst.a);const r0=repeatOn;repeatOn=false;bs[bst.j].click();repeatOn=r0},()=>{if(mb.isConnected&&mb.textContent[0]=='🔴')mb.textContent=L})};

  d.innerHTML='<b>'+'⭐'.repeat(Math.max(1,Math.round(r*3)))+'</b>'+html;const b=document.createElement('button');b.className='opt go';b.textContent='Continue ➜';

// ===================== ENGINE 1: hội thoại tuyến tính / phân nhánh (ca cũ, quầy dịch vụ) =====================
const lin=t=>{const nd={};t.forEach((x,i)=>{const nx=i+1<t.length?['a'+(i+1),'b'+(i+1)]:[];nd['a'+i]=[x[0],x[1],2,nx];if(x[2])nd['b'+i]=[x[0],x[2],0,nx,'That sounds unnatural. Better: "'+x[1]+'"']});return{st:['a0','b0'],nd}};
function dialog(cs,role,after){openDlg(cs);
  const G=cs.nd?cs:lin(cs.t),nd=G.nd,ic={D:cs.ic||'🩺',P:cs.pic||'🧑‍🦱'};let list=G.st,pts=0,mx=0;
  const S={tr:0,min:0,v:Object.assign({},cs.vit||{}),f:{},w:0},arr=a=>a==null?[]:[].concat(a),fx=k=>nd[k][5]||{};
  const ok=k=>{if(!nd[k])return false;const x=fx(k);return arr(x.need).every(f=>S.f[f])&&!arr(x.not).some(f=>S.f[f])&&(x.mt==null||S.tr>=x.mt)&&(x.xt==null||S.tr<=x.xt)};
  const expand=l=>[].concat(...l.map(k=>k=='H'?G.hub:[k])).filter(ok);
  const stat=()=>{if(!cs.vit)return;const v=S.v;setStat('<span>⏱ '+S.min+' min</span><span>❤️ '+v.hr+'</span><span>🩸 '+v.bp+'</span><span>🫁 '+v.sp+'%</span><span>🌡️ '+v.t+'°</span><span>🤝 '+trW(S.tr)+'</span>')};
  function apply(n){const x=n[5]||{};if(x.tr)S.tr=Math.max(-3,Math.min(3,S.tr+x.tr));if(x.min)S.min+=x.min;if(x.v)Object.assign(S.v,x.v);if(x.f)S.f[x.f]=1;if(x.find)note('🔎 '+x.find,'find');

  function end(){const r=mx?pts/mx:1;let e;
    if(cs.ends)e=cs.ends.find(q=>arr(q.f).every(f=>S.f[f])&&!arr(q.nf).some(f=>S.f[f])&&(q.t==null||S.min<=q.t)).x;

    while(list.length&&nd[list[0]][0]!=role){const n=nd[list[0]];say1(n);apply(n);list=expand(n[3])}

    ask((G.hub?list.slice():shuffle(list.slice())).map(k=>({t:nd[k][1],s:nd[k][2],cls:fx(k).a?'act':'',k})),it=>{const n=nd[it.k];pts+=n[2];mx+=2;say1(n,1);if(n[2]<2)note((n[2]?'👍 Acceptable: ':'❌ ')+(n[4]||''));apply(n);list=n[3];later(step,120)})}

// ===================== ENGINE 2: khám bệnh đầy đủ — vai BÁC SĨ =====================
const VSTR=v=>'Pulse '+v.hr+' l/p · HA '+v.bp+' mmHg · SpO₂ '+v.sp+'% · Temp '+v.t+'°C';
const exList=cs=>[['📟 Check vital signs',"I'm going to check your blood pressure, pulse and temperature.",'Hold out your arm for the blood pressure cuff','__v',1]].concat(cs.x);
function clinicDoc(cs,after){openDlg(cs);const D='🩺',PI=cs.pic||'🧑‍🦱',X=exList(cs),tK=Object.keys(cs.t||{}),nm=nameOf(cs.who);

  const stat=()=>{const v=S.v,q=x=>S.vt?x:'?';setStat('<span>⏱ '+S.min+' min'+(cs.tlim?' / '+cs.tlim:'')+'</span><span>💰 '+S.cost+'k</span><span>❤️ '+q(v.hr)+'</span><span>🩸 '+q(v.bp)+'</span><span>🫁 '+q(v.sp)+'</span><span>🌡️ '+q(v.t)+'</span><span>🤝 '+trW(S.tr)+'</span>')};
  const tick=m=>{S.min+=m;if(cs.tlim&&S.min>cs.tlim&&!S.w){S.w=1;Object.assign(S.v,cs.worse||{hr:S.v.hr+15});note('⏰ Over '+cs.tlim+' min — the patient is getting worse!','warn')}stat()};
  stat();note('Step 1: Greet · Step 2: History & examination · Step 3: Order tests · Step 4: Diagnosis & treatment','q');
  const EX=EXT[cs.who]||{},cm=s=>S.cm.push(s);S.cm=[];
  ask(shuffle([{t:'Good morning, '+nm+". I'm Dr. Minh. What brings you in today?",s:2},{t:"Next! What's wrong with you?",s:0}]),o=>{bub(D,o.t,1);cm(o.s);S.tr=o.s?1:-1;if(!o.s)note('❌ Not polite enough — the patient is more guarded now.');tick(1);

      ask(shuffle([{t:"Before we start, could you confirm your full name and date of birth for me?",s:2},{t:"You're "+nm+", right?",s:1},{t:"(Skip it and start the history)",s:0}]),o=>{cm(o.s);if(o.s){bub(D,o.t,1);later(()=>bub(PI,o.s==2?"Yes. I'm "+nm+", and my date of birth is on my ID card here.":"Yes, that's me."),150)}
        if(o.s<2)note(o.s?'👍 A closed question invites a wrong "yes" — ask for full name and date of birth.':'❌ Always confirm the right patient before examining.');
        later(()=>{bub(PI,cs.o[0]);hub()},450)})})});
  function hub(){const it=[];

    X.forEach((x,i)=>{if(!S.ex[i])it.push({t:x[0],cls:'act',s:x[4]?2:null,k:'x',i})});

    if(EX.ice&&!S.ice)it.push({t:'💬 What worries you most about all this?',s:2,k:'i'});

      ask(shuffle([{t:EX.ice[2],s:2},{t:EX.ice[3],s:0},{t:"Let's focus on the medical facts for now.",s:1}]),o=>{cm(o.s);bub(D,o.t,1);if(o.s==2){S.tr=Math.min(3,S.tr+1);stat();later(()=>bub(PI,"Thank you. That really helps."),150)}else note((o.s?'👍 Acceptable: ':'❌ ')+EX.ice[4]);later(hub,450)})})}
    else if(o.k=='o'){S.oth=1;bub(D,o.t.slice(3),1);tick(1);later(()=>{bub(PI,EX.ice?"No, I think I've told you everything.":"No, that's everything, I think.");hub()})}

  function tests(){const it=Object.keys(TS).filter(k=>!S.ts[k]).map(k=>({t:'🧪 '+TS[k].n+' · '+TS[k].c+'k · '+TS[k].m+' min',cls:'act',k,s:tK.includes(k)?2:null}));

  else if(mode=='D')h='🩺 <b>Doctor · '+spD.vi+'</b> · room '+spD.no+'<br>Ca: '+(cur?cur.cc+' — '+cur.who:'')+(cur&&cur._k=='c'?' · <b>full consultation</b>':cur&&cur._k=='g'?' · ⚡ scripted':'');
  else if(mode=='R')h='🎭 <b>'+spD.pf.vi+'</b> ('+spD.pf.n+') · '+spD.vi+'<br>Scenario: '+(cur?cur.cc+' — '+cur.who:'');
  else if(mode=='T')h='🚶 Free tour · Floor '+curF+'<br><small>'+FLOORS[curF]+'</small>';
  $('hud').innerHTML=h+(mode?'<br>🏢 Floor '+curF+' · Score: '+score+' · Completed: '+done+(live?' · 💡 '+hints:'')+(VS.n?' · 🎤 '+Math.round(VS.s/VS.n*100)+'%':''):'')}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
function fadeTo(txt,fn){const f=$('fade');f.textContent=txt;f.style.opacity=1;setTimeout(()=>{fn();setTimeout(()=>f.style.opacity=0,250)},380)}
function openLift(){busy=true;$('lift').style.display='flex';$('liftBtns').innerHTML=[1,2,3].map(f=>'<button class="big" data-f="'+f+'"'+(f==curF?' style="opacity:.55"':'')+'>Floor '+f+(f==curF?' (you are here)':'')+'<small>'+FLOORS[f]+'</small></button>').join('')}
$('liftBtns').onclick=e=>{const b=e.target.closest('button');if(!b)return;const f=+b.dataset.f;$('lift').style.display='none';if(f==curF){busy=false;return}
  fadeTo('🛗 Floor '+f,()=>{setFloor(f);P.position.set(26.2,0,0);P.rotation.y=-Math.PI/2;busy=false;hud()})};
$('liftX').onclick=()=>{$('lift').style.display='none';busy=false};
function begin(role){$('menu').style.display='none';if(P)scene.remove(P);GRP=null;P=person(role||(mode=='D'?'doc':'pat'),role?0:mode=='D'?0xffffff:0x5aa9e6);Object.values(NP).forEach(n=>{if(n.g.isObject3D)n.g.visible=true})}
$('mP').onclick=()=>{mode='P';begin();startPatient(0)};
$('mE').onclick=()=>{mode='P';begin();startPatient(1)};
$('mK').onclick=async()=>{const d=$('diag');d.style.display='block';const L=[];const put=()=>d.innerHTML=L.join('<br>');
  if(!window.speechSynthesis)L.push('🔇 This browser cannot read text aloud.');else{pickVoice();L.push(VOICE?'🔊 Voice: '+VOICE.name+' — playing a test sentence. Can you hear it?':'🔊 No English voice found on this device — trying the default voice.');say("Hello! If you can hear this, the sound is working.")}
  L.push('Turn up the volume and switch off silent mode.');put();
  if(!SR){L.push('🎤 This browser has no speech recognition. Use Chrome on a computer or Android (iPhone: recent Safari).');return put()}
  if(inFrame)L.push('⚠️ The game is embedded — the microphone may be blocked. If the test fails, open the game in its own Chrome tab.');
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop());L.push('🎤 Microphone allowed ✅ — now say "Good morning, doctor".');put();
    listen(a=>{L.push('🎤 Heard: "'+esc(a[0])+'" ✅ The microphone works!');put()},()=>{})}
  catch(e){L.push('🎤 Microphone blocked: '+(e.name=='NotAllowedError'?micErr('not-allowed'):e.name=='NotFoundError'?micErr('audio-capture'):e.message));put()}
  put()};
$('mT').onclick=()=>{mode='T';begin();setFloor(1);P.position.set(-23,0,0);busy=false;hud()};
$('mR').onclick=()=>{$('spGrid').style.display='grid';$('spGrid').scrollIntoView({behavior:'smooth'})};
const rlab=()=>{$('mRep').textContent='🗣️ Repeat my lines aloud: '+(repeatOn?'ON':'OFF');$('mEasy').textContent=easyOn?'🙂 Level: Easy (2 choices)':'🧠 Level: Normal (all choices)'};
try{const st=JSON.parse(localStorage.getItem('ge4u-h3d-prefs')||'{}');if(st.rep!=null)repeatOn=st.rep;if(st.easy!=null)easyOn=st.easy}catch(e){}
const prefs=()=>{try{localStorage.setItem('ge4u-h3d-prefs',JSON.stringify({rep:repeatOn,easy:easyOn}))}catch(e){}rlab()};rlab();
$('mRep').onclick=()=>{repeatOn=!repeatOn;prefs()};$('mEasy').onclick=()=>{easyOn=!easyOn;prefs()};
const vlab=()=>$('mV').textContent=SR?'🎤 Speaking practice: '+(voiceOn?'ON':'OFF'):'🎤 Speaking practice needs Chrome (not supported here)';vlab();$('mV').onclick=()=>{voiceOn=SR?!voiceOn:false;vlab()};
$('spGrid').innerHTML='<div style="grid-column:1/-1;color:#a9c4d2">👩‍⚕️ Other health professions</div>'+PROF.map(p=>'<button data-r="'+p.id+'">'+p.e+' '+p.n+'<br><small>'+R[p.room].n+'</small></button>').join('')+'<div style="grid-column:1/-1;color:#a9c4d2">🩺 Specialist doctors</div>'+ROOMS.filter(r=>r.d).map(r=>{const n=casesFor(r.id),c=n.filter(x=>x.k=='c').length,g=n.filter(x=>x.k=='g').length;return'<button data-i="'+r.id+'">'+r.e+' '+r.n+'<br><small>Floor '+r.f+' · '+n.length+' cases'+(c?' · '+c+' full':'')+(g?' · '+g+' ⚡':'')+'</small></button>'}).join('');
$('spGrid').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.r){mode='R';begin(PROF.find(p=>p.id==b.dataset.r).role);startProf(b.dataset.r)}else{mode='D';begin();startDoctor(b.dataset.i)}};
$('menuBtn').onclick=()=>{busy=true;clearTimeout(voteTimer);$('dlg').style.display='none';$('lift').style.display='none';$('menu').style.display='flex';$('spGrid').style.display='none'};

function talk(){if(!near||busy)return;
  if(near.lift)return openLift();
  if(mode=='P'){const s=J[ji];if(!s||NP[s.to]!==near)return;busy=true;s.go(stepDone)}
  else if((mode=='D'||mode=='R')&&near.g===pat){busy=true;runDoctorCase()}}
$('talk').onclick=talk;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k=='e'||k=='enter')talk()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

// cần điều khiển
const jy=$('joy'),kn=$('knob');let jid=null;
const jmove=e=>{const r=jy.getBoundingClientRect();let dx=e.clientX-(r.left+60),dz=e.clientY-(r.top+60);const l=Math.hypot(dx,dz);if(l>45){dx*=45/l;dz*=45/l}kn.style.left=40+dx+'px';kn.style.top=40+dz+'px';joy.x=dx/45;joy.z=dz/45};
jy.onpointerdown=e=>{jid=e.pointerId;jy.setPointerCapture(jid);jmove(e)};jy.onpointermove=e=>{if(e.pointerId==jid)jmove(e)};
jy.onpointerup=jy.onpointercancel=()=>{jid=null;joy.x=joy.z=0;kn.style.left=kn.style.top='40px'};

// ===================== TIKTOK LIVE (tuỳ chọn): chạy server.js rồi mở file này trên máy =====================
function feed(h){const d=document.createElement('div');d.innerHTML=h;d.style.cssText='background:rgba(255,255,255,.92);border-radius:10px;padding:4px 8px;margin-top:4px;font-size:13px';const f=$('feed');f.prepend(d);while(f.children.length>5)f.lastChild.remove();setTimeout(()=>d.remove(),9000)}
function onLive(m){
  if(m.type=='gift'){hints=Math.min(hints+(m.coins>=50?3:1),5);feed('🎁 <b>'+esc(m.user)+'</b> sent '+esc(m.name||'a gift')+' → 💡 hint');if(mode)hud()}
  else if(m.type=='chat'){const t=String(m.text||'').trim();feed('💬 <b>'+esc(m.user)+'</b>: '+esc(t.slice(0,40)));if(vote&&/^[1-9]$/.test(t))vote(m.user,+t)}
  else if(m.type=='follow')feed('👋 <b>'+esc(m.user)+'</b> just followed')}
function connectLive(){let ws;try{ws=new WebSocket('ws://localhost:8080')}catch(e){return}
  ws.onopen=()=>{live=true;feed('🔴 Connected to TikTok Live');if(mode)hud()};
  ws.onclose=()=>{live=false;setTimeout(connectLive,5000)};ws.onerror=()=>{};
  ws.onmessage=e=>{try{onLive(JSON.parse(e.data))}catch(_){}}}
if(location.protocol!='https:')connectLive();

// ===================== VÒNG LẶP =====================
let last=0,tt=0;
let paused=false;document.addEventListener('visibilitychange',()=>{paused=document.hidden;if(!paused){last=performance.now();requestAnimationFrame(loop)}});
function loop(ms){if(paused)return;requestAnimationFrame(loop);const dt=Math.min((ms-last)/1000,.05);last=ms;tt+=dt;
  const px=P?P.position.x:99,pz=P?P.position.z:99;
  if(!LOWP&&P){dl.position.set(px+8,20,pz+10);dl.target.position.set(px,0,pz)}
  NPCF[curF].concat(pat&&mode=='D'?[pat]:[]).forEach(g=>{if(!g.visible)return;const dx=px-g.position.x,dz=pz-g.position.z,d=Math.hypot(dx,dz);let a=0;
    if(d<7){a=Math.atan2(dx,dz)-g.rotation.y;a=Math.atan2(Math.sin(a),Math.cos(a));a=Math.max(-.9,Math.min(.9,a))}
    g.head.rotation.y+=(a-g.head.rotation.y)*.1;g.arms[0].rotation.x=Math.sin(tt*1.5+g.position.x)*.05;g.arms[1].rotation.z=d<3?2.4+Math.sin(tt*8)*.25:.05});
  WALK[curF].forEach((w,i)=>{const g=w.g;g.position.x+=w.d*w.sp*dt;if(g.position.x>22||g.position.x<-22)w.d*=-1;g.rotation.y=w.d>0?Math.PI/2:-Math.PI/2;
    const sw=Math.sin(tt*6+i)*.6;g.legs[0].rotation.x=sw;g.legs[1].rotation.x=-sw;g.arms[0].rotation.x=-sw;g.arms[1].rotation.x=sw});
  if(P){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.z;const l=Math.hypot(dx,dz);let mv=!busy&&l>.12;
    if(mv){if(l>1){dx/=l;dz/=l}const nx=P.position.x+dx*6.5*dt,nz=P.position.z+dz*6.5*dt;if(allowed(nx,P.position.z))P.position.x=nx;if(allowed(P.position.x,nz))P.position.z=nz;P.rotation.y=Math.atan2(dx,dz)}
    const sw=mv?Math.sin(tt*11)*.7:0;P.legs[0].rotation.x=sw;P.legs[1].rotation.x=-sw;P.arms[0].rotation.x=-sw;P.arms[1].rotation.x=sw;
    cam.position.lerp(new THREE.Vector3(P.position.x,10.5,P.position.z+7.5),.1);cam.lookAt(P.position.x,.8,P.position.z-1);
    // ai đang ở gần: mục tiêu hiện tại + thang máy
    near=null;let bd=2.8;const T=[NP['lift'+curF]],tg=tgt();if(tg&&tg.f==curF)T.push(tg);
    T.forEach(o=>{if(!o||!o.g.visible)return;const d=Math.hypot(o.g.position.x-P.position.x,o.g.position.z-P.position.z);if(d<bd){bd=d;near=o}});
    const tb=$('talk');tb.style.display=near&&!busy?'block':'none';tb.textContent=near&&near.lift?'🛗 Elevator':'💬 Talk';
    const t=tgt();mark.visible=!!(t&&t.f==curF);if(mark.visible)mark.position.set(t.g.position.x,2.9+Math.sin(tt*4)*.15,t.g.position.z)}
  else mark.visible=false;
  ren.render(scene,cam)}
setFloor(1);cam.position.set(-30,12,8);cam.lookAt(-26,0,0);requestAnimationFrame(loop);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
</script>
